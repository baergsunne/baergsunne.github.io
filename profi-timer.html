</style></head><body><header><a href="./#home">← Bärgsunne Poker</a><span class="eyebrow">BLINDS-TIMER · LENK</span></header><main><div class="eyebrow">BÄRGSUNNE POKER</div><h1>Profi Blinds-Timer</h1><p class="sub">Dein privater Turniertimer – lokal auf diesem Gerät, unabhängig vom offiziellen Turnier.</p><div class="tabs"><button data-tab="settings">1. Planung</button><button data-tab="structure">2. Blindstufen</button><button data-tab="timer">3. Timer</button></div><div id="app"></div></main><footer>LOKAL · PRIVAT · KEIN LIVE-SYNC</footer><script>
(()=>{'use strict';const key='bp-profi-timer-demo-v1',defaults=[[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[600,1200],[800,1600],[1200,2400],[2000,4000]];const base=()=>({title:'Pokerabend',players:10,stack:5000,target:150,levelMinutes:12,levels:defaults.map(([sb,bb])=>({sb,bb,ante:0,minutes:12})),breaks:[],chips:[25,100,500,1000],level:0,remaining:720,running:false,deadline:0,sound:true,breakPending:0,eventLog:[],proMode:null,proStarted:false,participants:[],proEvents:[],rebuysAllowed:true,rebuyStack:5000,addonStack:5000,proYear:2026,proRound:1});let d=base(),tab='settings',full=false,mode='level',planningMode='suggest',pendingProposal=null,expandedEntry=null,audio=null;try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.levels)&&saved.levels.length){const {races,completedRaces,racePending,...clean}=saved;d={...base(),...clean,running:false};if(!Array.isArray(d.participants))d.participants=[];if(!Array.isArray(d.proEvents))d.proEvents=[];if(d.breakPending){d.breakPending=0;d.remaining=d.levels[d.level]?.minutes*60||720;}}}catch{}function store(){try{const {races,completedRaces,racePending,...clean}=d;localStorage.setItem(key,JSON.stringify({...clean,running:false}))}catch{}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.round(Number(n)||0).toLocaleString('de-CH');const time=n=>String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0');const btn=(label,act,cls='')=>'<button class="button '+cls+'" data-action="'+act+'">'+label+'</button>';const field=(k,label,v,type='number')=>'<label class="field"><span>'+label+'</span><input data-field="'+k+'" type="'+type+'" value="'+esc(v)+'"></label>';function beep(){if(!d.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=740;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}function stages(){const l=d.levels[d.level]||d.levels[0],next=d.levels[d.level+1];return '<div class="blindstage"><div class="level">LEVEL '+(d.level+1)+' VON '+d.levels.length+'</div><div class="blinds">'+fmt(l.sb)+' / '+fmt(l.bb)+'</div><div class="ante">SMALL BLIND / BIG BLIND'+(l.ante?' · ANTE '+fmt(l.ante):'')+'</div><div class="clock" id="remaining">'+time(d.remaining)+'</div><div class="stage-meta minor">'+(mode==='break'?'PAUSE':'NÄCHSTES LEVEL: '+(next?fmt(next.sb)+' / '+fmt(next.bb):'Turnierende nach Bedarf'))+'</div><div class="controls">'+btn('◀ Zurück','prev')+btn(d.running?'Ⅱ Pause':'▶ Start','toggle','primary')+btn('■ Stopp','stop')+btn('Weiter ▶','next')+btn('↺ Reset','reset')+btn(full?'⤡ Schliessen':'⛶ Vollbild','fullscreen')+'</div></div>'}function timerView(){const l=d.levels[d.level];return '<div id="stage" class="'+(full?'fullstage':'')+'">'+stages()+'</div>'+(full?'':'<section class="card"><div class="row"><strong>'+esc(d.title)+'</strong><span class="pill">'+d.players+' Spieler · '+fmt(d.stack)+' Startchips</span></div><p class="minor">Tippe «Vollbild», um Blinds und Uhr möglichst gross darzustellen. Der Countdown stoppt auf Wunsch bei Pausen.</p><div class="row">'+btn('+ Pause starten','pause')+btn('Signalton testen','beep')+'</div></section><section class="card"><h2>Nächste Blindstufen</h2>'+d.levels.slice(d.level,d.level+5).map((l,i)=>'<div class="line"><span>Level '+(d.level+i+1)+'</span><span>'+fmt(l.sb)+' / '+fmt(l.bb)+' · '+l.minutes+' Min.</span></div>').join('')+'</section>')}function structureView(){const entries=[];d.levels.forEach((l,i)=>{entries.push({type:'level',index:i,item:l});d.breaks.filter(b=>b.after===i+1).forEach(b=>entries.push({type:'break',index:d.breaks.indexOf(b),item:b}))});const total=d.levels.reduce((n,l)=>n+l.minutes,0)+d.breaks.reduce((n,b)=>n+b.minutes,0);return '<section class="card"><h2>Blindstruktur</h2><p class="minor">'+d.levels.length+' Blindstufen · '+d.breaks.length+' Pausen · '+total+' Minuten geplant</p><details><summary>Alle Blindzeiten ändern</summary><div class="grid">'+field('globalMinutes','Minuten je Level',d.levelMinutes)+btn('Auf alle Level anwenden','apply-global','primary')+'</div><p class="minor">Pausen behalten ihre Dauer.</p></details>'+entries.map(x=>{const id=x.type+'-'+x.index,open=expandedEntry===id;return '<div class="line" style="display:block"><div class="row"><button class="button" data-action="expand-'+id+'" style="flex:1;text-align:left">'+(x.type==='level'?'Level '+(x.index+1)+' · '+fmt(x.item.sb)+' / '+fmt(x.item.bb):'☕ Pause nach Level '+x.item.after)+'<span class="minor"> · '+x.item.minutes+' Min. '+(open?'▲':'✎')+'</span></button>'+btn('↑','move-'+id+'-up')+btn('↓','move-'+id+'-down')+'</div>'+(open?'<div class="grid">'+(x.type==='level'?field('sb-'+x.index,'Small Blind',x.item.sb)+field('bb-'+x.index,'Big Blind',x.item.bb)+field('ante-'+x.index,'Ante',x.item.ante):field('pauseafter-'+x.index,'Nach Level',x.item.after))+field(x.type==='level'?'minutes-'+x.index:'pauseduration-'+x.index,'Dauer (Min.)',x.item.minutes)+'</div><div class="row">'+btn('Entfernen',x.type==='level'?'remove-'+x.index:'delbreak-'+x.index)+'</div>':'')+'</div>'}).join('')+'<div class="grid">'+btn('+ Blindlevel','addlevel')+btn('+ Pause','addbreak-structure')+'</div><div class="row">'+btn('Weiter zum Timer →','to-timer','primary')+'</div></section>'}function settingsView(){let breaks=d.breaks;return '<section class="card"><h2>Turnier planen</h2><p class="minor">Wähle zuerst, wie du deine Blindstufen erstellen möchtest.</p><div class="grid"><button type="button" class="button '+(planningMode==='manual'?'primary':'')+'" data-plan="manual" aria-pressed="'+(planningMode==='manual')+'">Selber erstellen</button><button type="button" class="button '+(planningMode==='suggest'?'primary':'')+'" data-plan="suggest" aria-pressed="'+(planningMode==='suggest')+'">Vorschlagen lassen</button></div>'+field('title','Name',d.title,'text')+'<div class="grid">'+ '<div class="field"><span>Teilnehmer</span><p class="pill">'+d.participants.length+' erfasst</p></div>' +field('stack','Startstack',d.stack)+(planningMode==='suggest'?field('target','Zieldauer inklusive Pausen (Min.)',d.target):'')+'</div>'+(planningMode==='suggest'?'<p class="minor">Aus Spielerzahl, Startstack, verfügbaren Chipwerten und gewünschter Dauer wird eine Blindstruktur vorgeschlagen. Die tatsächliche Spieldauer hängt von den Ausscheidungen ab.</p>': '<p class="minor">Du erstellst und bearbeitest jede Blindstufe selbst. Bestehende Stufen bleiben erhalten.</p>')+'</section><section class="card"><h2>Chipwerte (optional)</h2><p class="minor">Wähle die vorhandenen Chipwerte für die Berechnung der Blindstruktur:</p><div class="chip-options">'+[1,2,5,10,25,50,100,500,1000,5000,10000].map(v=>'<button type="button" class="button chip-option '+(d.chips.includes(v)?'selected':'')+'" data-chip="'+v+'" aria-pressed="'+d.chips.includes(v)+'">'+fmt(v)+'</button>').join('')+'</div><p class="minor">Ausgewählt: '+(d.chips.length?d.chips.map(fmt).join(' · '):'Keine Chipwerte')+'</p>'+'</section><section class="card"><h2>Pausen vorplanen (optional)</h2>'+breaks.map((b,i)=>'<div class="line"><span>Nach Level '+b.after+' · '+b.minutes+' Min.</span>'+btn('Entfernen','delbreak-'+i)+'</div>').join('')+'<div class="grid">'+field('breakAfter','Nach Level',Math.min(d.levels.length,4))+field('breakMinutes','Dauer (Min.)',5)+'</div>'+btn('+ Pause einplanen','addbreak')+'</section><section class="card"><h2>Nächster Schritt</h2>'+(planningMode==='suggest'?btn('Blindstufen aus Angaben berechnen','generate','primary'):btn('Blindstufen selbst bearbeiten','to-structure','primary'))+'</section><section class="card"><h2>Timer speichern</h2><label class="row"><span>Signaltöne aktiv</span><input type="checkbox" data-sound '+(d.sound?'checked':'')+'></label><div class="grid">'+btn('Einstellungen exportieren','export')+btn('Gespeicherte Datei laden','import')+'</div><input class="hidden" type="file" id="import" accept="application/json,.json"><p class="minor">Automatisch lokal gespeichert. Beim Wiederöffnen startet der Timer sicherheitshalber pausiert. Ein Signal im Hintergrund ist auf iOS nicht garantiert.</p></section>'}
const examplePlayers=Array.from({length:10},(_,i)=>'Testspieler '+(i+1));
const proEsc=esc;
const proStamp=()=>new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
function proPlayers(){const ps=Array.isArray(d.participants)?d.participants:[];const persons=new Map(ps.map(name=>[name,{name,active:true,rebuys:0,addons:0}]));let order=[];for(const e of Array.isArray(d.proEvents)?d.proEvents:[]){let p=persons.get(e.name);if(!p)continue;if(e.type==='out'&&p.active){p.active=false;order=order.filter(x=>x!==e.name);order.push(e.name)}else if(e.type==='rebuy'&&!p.active){p.active=true;p.rebuys++;order=order.filter(x=>x!==e.name)}else if(e.type==='rebuy'&&p.active){p.rebuys++}else if(e.type==='addon'&&p.active){p.addons++}}return{people:[...persons.values()],order}}
function proStats(){const x=proPlayers(),alive=x.people.filter(p=>p.active),rebuy=x.people.reduce((n,p)=>n+p.rebuys,0),addon=x.people.reduce((n,p)=>n+p.addons,0),chips=x.people.length*d.stack+rebuy*d.rebuyStack+addon*d.addonStack;return{...x,alive,rebuy,addon,chips,avg:alive.length?Math.round(chips/alive.length):0}}
function proResult(){const s=proStats();if(s.people.length<2||s.alive.length!==1||s.order.length!==s.people.length-1)return null;return [s.alive[0].name,...[...s.order].reverse()]}
function proBanner(){return '<div class="probar"><div><strong>'+(d.proMode==='official'?'🏆 Bärgsunne-Runde':'♠ Freies Turnier')+'</strong><div class="progray">'+(d.proMode==='official'?'Vorschau ohne Anbindung an die offizielle Datenbank':'Unabhängig · lokal gespeicherte Testdaten')+'</div></div>'+(!d.proStarted?btn('Turnierart ändern','pro-switch'):btn('Neues Turnier','pro-new'))+'</div><p class="prowarn">ENTWICKLUNGSVORSCHAU: Noch keine Administrator-Anmeldung, keine öffentliche Freigabe und kein echter QR-Live-Zugang. Offizielle Turnierdaten werden weder gelesen noch verändert.</p>'}
function proChoice(){return '<section class="card"><div class="eyebrow">ADMINISTRATOR · KONZEPTTEST</div><h2>Welchen Profi-Timer starten?</h2><p class="sub">Ein Klick bestimmt die Turnierart. Sobald der Timer gestartet wurde, bleibt sie für dieses Turnier gesperrt.</p><div class="prochoice"><button data-pro="choose-official"><span style="font-size:33px">🏆</span><strong>Bärgsunne-Runde</strong><span>Mit offizieller Rundenauswertung (Integration noch nicht aktiviert)</span></button><button data-pro="choose-free"><span style="font-size:33px">♠</span><strong>Freies Turnier</strong><span>Für Firmen- und Familienabende, getrennt von Bärgsunne</span></button></div><p class="minor">Der einfache öffentliche Privat-Timer bleibt ein separates Angebot ohne Login und ohne Live-Zuschauer.</p></section>'}
function proPanel(){const v=proStats(),result=proResult(),started=d.proStarted;return '<section class="card" id="pro-panel"><div class="row"><h2>Turnierleitung</h2><span class="pill">'+v.alive.length+' / '+v.people.length+' aktiv</span></div>'+
(!started?'<p class="minor">Teilnehmer mit einem Namen pro Zeile erfassen. Sobald die Uhr gestartet wurde, ist die Liste fixiert.</p><label class="field"><span>Spieler (2–20)</span><textarea data-profield="participants" placeholder="Ein Spieler pro Zeile">'+proEsc(d.participants.join('\n'))+'</textarea></label>'+(d.proMode==='official'?'<p class="prowarn">Offizieller Modus: Die echten Spieler und Rundendaten dürfen später nur über die geschützte Turnierverwaltung geladen werden. Für diesen Oberflächentest können Testspieler verwendet werden.</p>'+btn('Testspieler einfügen','pro-example'):'')+
'<div class="grid">'+field('rebuyStack','Chips pro Rebuy',d.rebuyStack)+field('addonStack','Chips pro Add-on',d.addonStack)+'</div>':'<p class="minor">Zum Ändern der Teilnehmer ein neues Turnier beginnen. So bleiben Platzierungen nachvollziehbar.</p>')+
'<div class="grid"><div class="pill">Gesamtchips: '+fmt(v.chips)+'</div><div class="pill">Ø Stack: '+fmt(v.avg)+'</div><div class="pill">Rebuys: '+v.rebuy+'</div><div class="pill">Add-ons: '+v.addon+'</div></div>'+
'<div class="prolist">'+v.people.map(p=>'<div class="proplayer '+(!p.active?'proinactive':'')+'"><div><strong>'+proEsc(p.name)+'</strong><div class="protag">'+(p.active?'Im Spiel':'Ausgeschieden')+' · Rebuys '+p.rebuys+' · Add-ons '+p.addons+'</div></div>'+(started?'<div class="row">'+(p.active?btn('Ausscheiden','pro-out-'+encodeURIComponent(p.name)):btn('Rebuy & zurück','pro-rebuy-'+encodeURIComponent(p.name)))+(p.active?btn('Rebuy','pro-rebuy-'+encodeURIComponent(p.name))+btn('Add-on','pro-addon-'+encodeURIComponent(p.name)):'')+'</div>':'')+'</div>').join('')+'</div>'+
(started?'<div class="row">'+btn('Letzte Aktion rückgängig','pro-undo')+'</div>':'<p class="minor">Starte den Timer unter «Timer», sobald die Spielerliste bereit ist.</p>')+
'<div class="row"><h2>Rundenergebnis</h2></div>'+
(result?'<div class="proresult">'+result.map((p,i)=>'<p><span>'+(i+1)+'. '+proEsc(p)+'</span><span>'+((d.proMode==='official')?('Platz '+(i+1)):'')+'</span></p>').join('')+'</div><p class="minor">Aus der Ausscheidungsreihenfolge errechnet. Vor Veröffentlichung immer kontrollieren.</p>'+btn('Ergebnis als JSON exportieren','pro-export','primary')+(d.proMode==='official'?'<p class="prowarn">Die offizielle Freigabe ist in dieser Vorschau absichtlich gesperrt. Erst nach sicherer Integration in die bestehende Admin-API darf daraus ein echter Rundenergebnis-Entwurf werden.</p>':''):'<p class="minor">Das endgültige Ergebnis erscheint, sobald nur noch ein Spieler aktiv ist. Rebuys werden als Wiedereinstieg berücksichtigt.</p>')+

function proAction(a){if(a==='pro-switch'&&!d.proStarted){d.proMode=null;d.proEvents=[];d.participants=[];tab='settings'}else if(a==='pro-new'){if(!confirm('Dieses Testturnier löschen und die Turnierart neu wählen?'))return;d=base();tab='settings'}else if(a==='pro-example'&&!d.proStarted){d.participants=[...examplePlayers];d.players=d.participants.length}else if(a==='pro-undo'&&d.proEvents?.length){d.proEvents.pop()}else if(a==='pro-export'){const places=proResult();if(!places)return;const doc={format:'baergsunne-profi-probe-v1',mode:d.proMode,officialPublication:false,title:d.title,places,events:d.proEvents,statistics:{totalChips:proStats().chips,rebuys:proStats().rebuy,addons:proStats().addon}};const url=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='poker-rundenergebnis-entwurf.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
else{const m=a.match(/^pro-(out|rebuy|addon)-(.+)$/);if(!m||!d.proStarted)return;const name=decodeURIComponent(m[2]),x=proStats().people.find(p=>p.name===name);if(!x)return;if(m[1]==='out'&&!x.active)return;if(m[1]==='addon'&&!x.active)return;if(m[1]==='rebuy'&&!(d.rebuysAllowed))return;if(proResult()&&m[1]!=='rebuy')return;d.proEvents.push({type:m[1],name,at:proStamp()});}store();render()}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.getElementById('app').innerHTML=!d.proMode?proChoice():proBanner()+'<div class="procols"><div>'+(pendingProposal?'<section class="card"><h2>Dein Blindstruktur-Vorschlag</h2><p class="sub">'+pendingProposal.levels.length+' Blindstufen à '+pendingProposal.minute+' Minuten · '+pendingProposal.pauseTime+' Minuten Pausen · insgesamt ca. '+pendingProposal.actual+' Minuten.</p><p class="minor">Dies ist eine Planung, keine garantierte Turnierdauer. Die bisherigen Stufen werden erst mit Übernehmen ersetzt.</p>'+pendingProposal.levels.map((l,i)=>'<div class="line"><span>Level '+(i+1)+'</span><span>'+fmt(l.sb)+' / '+fmt(l.bb)+'</span></div>').join('')+'<div class="grid">'+btn('Abbrechen','cancel-proposal')+btn('Übernehmen','accept-proposal','primary')+'</div></section>':tab==='timer'?timerView():tab==='structure'?structureView():settingsView())+'</div>'+proPanel()+'</div>';if(full&&tab!=='timer'){full=false;render()}}function advanceLevel(){const after=d.level+1;d.running=false;if(d.level>=d.levels.length-1){d.remaining=0;return;}d.level++;const pause=d.breaks.find(x=>x.after===after);if(pause){mode='break';d.remaining=pause.minutes*60;}else{mode='level';d.remaining=d.levels[d.level].minutes*60;}}function sync(){if(!d.running)return;d.remaining=Math.max(0,Math.ceil((d.deadline-Date.now())/1000));if(d.remaining>0)return;d.running=false;beep();if(mode==='break'){mode='level';d.remaining=d.levels[d.level].minutes*60;}else advanceLevel();store();render()}function action(a){if(a==='apply-global'){const f=document.querySelector('[data-field="globalMinutes"]');const m=Number(f?.value);if(!Number.isFinite(m)||m<1||m>240){alert('Bitte 1 bis 240 Minuten eingeben.');return;}d.levelMinutes=m;d.levels.forEach(l=>l.minutes=m);if(!d.running)d.remaining=d.levels[d.level].minutes*60;}else if(a==='to-structure'){tab='structure'}else if(a==='to-timer'){tab='timer'}else if(a.startsWith('expand-')){const id=a.slice(7);expandedEntry=expandedEntry===id?null:id}else if(a==='addbreak-structure'){if(d.levels.length<2){alert('Mindestens zwei Level nötig.');return;}d.breaks.push({after:Math.min(d.levels.length-1,Math.max(1,d.level+1)),minutes:5});expandedEntry='break-'+(d.breaks.length-1)}else if(a.startsWith('move-')){const m=a.match(/^move-(level|break)-(\d+)-(up|down)$/);if(m){const kind=m[1],i=Number(m[2]),delta=m[3]==='up'?-1:1;if(kind==='level'){const j=i+delta;if(j>=0&&j<d.levels.length){[d.levels[i],d.levels[j]]=[d.levels[j],d.levels[i]];expandedEntry='level-'+j}}else{const b=d.breaks[i];if(b){b.after=Math.max(1,Math.min(d.levels.length-1,b.after+delta));expandedEntry='break-'+i}}}}else if(a==='toggle'){if(!d.proStarted){if(d.participants.length<2){alert('Zuerst mindestens zwei Teilnehmer im Bereich Turnierleitung erfassen.');return;}d.proStarted=true;}if(!d.remaining){d.remaining=d.levels[d.level].minutes*60}d.running=!d.running;if(d.running){d.deadline=Date.now()+d.remaining*1000;beep()}}else if(a==='stop'){d.breakPending=0;d.running=false;d.remaining=d.levels[d.level].minutes*60;mode='level'}else if(a==='prev'||a==='next'){d.breakPending=0;d.running=false;mode='level';d.level=Math.max(0,Math.min(d.levels.length-1,d.level+(a==='next'?1:-1)));d.remaining=d.levels[d.level].minutes*60}else if(a==='reset'){d.breakPending=0;d.running=false;mode='level';d.remaining=d.levels[d.level].minutes*60}else if(a==='fullscreen'){full=!full;if(full&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!full&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}else if(a==='beep')beep();else if(a==='pause'){d.running=false;mode='break';d.remaining=5*60}else if(a==='generate'){const pauseTime=d.breaks.reduce((n,b)=>n+b.minutes,0),available=d.target-pauseTime,start=Math.min(...d.chips.filter(v=>Number.isInteger(v)&&v>0));if(!Number.isFinite(start)||!Number.isFinite(available)||available<20||d.players<2||d.stack<1){alert('Bitte Spielerzahl, Startstack, Chipwerte und eine ausreichend lange Zieldauer eingeben.');return;}const totalChips=d.players*d.stack;const numberOfLevels=Math.max(5,Math.min(18,Math.round(available/12)));const minute=Math.max(3,Math.round(available/numberOfLevels));const n=Math.max(4,Math.round(available/minute));const startingBB=start*2,finalBB=Math.max(startingBB,totalChips/8),growth=n>1?Math.pow(finalBB/startingBB,1/(n-1)):1;let previous=0;const levels=Array.from({length:n},(_,i)=>{const intended=startingBB*Math.pow(growth,i),bb=Math.max(startingBB,Math.round(intended/(2*start))*(2*start),previous+(i?2*start:0));previous=bb;return {sb:bb/2,bb,ante:0,minutes:minute}});pendingProposal={levels,minute,pauseTime,totalChips,actual:n*minute+pauseTime};render();}else if(a==='accept-proposal'){if(!pendingProposal)return;d.running=false;d.levels=pendingProposal.levels;d.levelMinutes=pendingProposal.minute;d.level=0;d.remaining=d.levels[0].minutes*60;mode='level';pendingProposal=null;tab='structure';}else if(a==='cancel-proposal'){pendingProposal=null;}else if(a==='addlevel'){const l=d.levels.at(-1);d.levels.push({sb:l.bb,bb:l.bb*2,ante:0,minutes:d.levelMinutes});expandedEntry='level-'+(d.levels.length-1)}else if(a.startsWith('remove-')){let i=Number(a.split('-')[1]);if(d.levels.length>1){d.levels.splice(i,1);d.level=Math.min(d.level,d.levels.length-1)}}else if(a==='addbreak'){let after=Number(document.querySelector('[data-field="breakAfter"]').value),minutes=Number(document.querySelector('[data-field="breakMinutes"]').value);if(after>=1&&after<d.levels.length&&minutes>0)d.breaks.push({after,minutes});else alert('Bitte ein gültiges Level und eine positive Dauer wählen.')}else if(a.startsWith('delbreak-'))d.breaks.splice(Number(a.split('-')[1]),1);else if(a==='export'){let blob=new Blob([JSON.stringify({format:'baergsunne-blinds-v1',settings:((({races,completedRaces,racePending,...clean})=>({...clean,running:false}))(d))},null,2)],{type:'application/json'}),el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download='baergsunne-blinds-timer.json';el.click();setTimeout(()=>URL.revokeObjectURL(el.href),1500)}else if(a==='import')document.getElementById('import').click();store();render()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.pro){if(b.dataset.pro==='choose-official'||b.dataset.pro==='choose-free'){d=base();d.proMode=b.dataset.pro==='choose-official'?'official':'free';d.title=d.proMode==='official'?'Bärgsunne · Test-Runde':'Privater Pokerabend';store();render();return;}}if(b.dataset.chip!==undefined){let v=Number(b.dataset.chip);d.chips=d.chips.includes(v)?d.chips.filter(x=>x!==v):[...d.chips,v].sort((a,b)=>a-b);store();render();return;}if(b.dataset.plan){planningMode=b.dataset.plan;pendingProposal=null;render();return}if(b.dataset.tab){tab=b.dataset.tab;full=false;render()}else if(b.dataset.action){if(b.dataset.action.startsWith('pro-'))proAction(b.dataset.action);else action(b.dataset.action)}});document.addEventListener('change',async e=>{let x=e.target;if(x.dataset.profield==='participants'&&!d.proStarted){const entries=x.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(entries.length>20||new Set(entries.map(s=>s.toLocaleLowerCase('de-CH'))).size!==entries.length){alert('Maximal 20 eindeutige Spielernamen.');render();return;}d.participants=entries;d.players=entries.length;store();render();return;}if(x.dataset.field==='breakAfter'||x.dataset.field==='breakMinutes'||x.dataset.field==='globalMinutes'){return;}if(x.dataset.field){let k=x.dataset.field;if(/^pause(after|duration)-\d+$/.test(k)){let [kind,i]=k.split('-');let b=d.breaks[+i];if(b){if(kind==='pauseafter')b.after=Math.max(1,Math.min(d.levels.length-1,Number(x.value)||1));else b.minutes=Math.max(1,Number(x.value)||1);}}else if(/^(sb|bb|ante|minutes)-\d+$/.test(k)){let [name,i]=k.split('-');d.levels[+i][name]=Math.max(name==='ante'?0:1,Number(x.value)||0)}else if(['title','players','stack','target','levelMinutes','rebuyStack','addonStack'].includes(k)){d[k]=k==='title'?x.value:Math.max(1,Number(x.value)||1)}}else if(x.dataset.sound!==undefined)d.sound=x.checked;else if(x.id==='import'&&x.files?.[0]){try{let o=JSON.parse(await x.files[0].text());if(o.format!=='baergsunne-blinds-v1'||!Array.isArray(o.settings?.levels)||!o.settings.levels.length)throw Error('Dateiformat');if(!confirm('Bestehende Timer-Einstellungen durch die Datei ersetzen?'))return;const {races,completedRaces,racePending,proMode,proStarted,participants,proEvents,...clean}=o.settings;d={...base(),...clean,running:false,proMode:d.proMode,proStarted:false,participants:[],proEvents:[]};mode='level'}catch(err){alert('Import fehlgeschlagen: '+err.message)}}store();render()});setInterval(()=>{sync();if(d.running){let node=document.getElementById('remaining');if(node)node.textContent=time(d.remaining);if(d.remaining%10===0)store()}},500);render()})();
