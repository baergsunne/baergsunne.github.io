<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#081510"><title>Bärgsunne Poker · Live-Administration</title><link rel="stylesheet" href="admin-live.css"></head><body><main><a href="./#live">← Live-Seite</a><h1>Bärgsunne Poker · Live</h1><p>Turnierverwaltung auf deinem Smartphone</p><p id="message" role="status" aria-live="polite"></p><section id="login"><h2>Anmelden</h2><form id="login-form"><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form><a href="setup.html">Ersteinrichtung</a></section><section id="panel" hidden><button id="logout" class="subtle">Abmelden</button><h2 id="heading"></h2><label>Turnierjahr<input id="year" type="number" min="2026" max="2100" value="2026"></label><button id="load" class="subtle">Jahr laden</button><section id="configuration"><h3>Turnier vorbereiten</h3><p>Vor der ersten Runde lassen sich Spieler, Runden und Punkte anpassen. Danach bleibt die Regel fest.</p><label>Teilnehmer (ein Name pro Zeile)<textarea id="players"></textarea></label><label>Rundenanzahl<input id="round-count" type="number" min="1" max="30"></label><label>Punkte nach Platz (Komma getrennt)<input id="points"></label><button id="save-config">Turnier speichern</button></section><section id="round-panel"><h3>Runde erfassen</h3><label>Runde<select id="round"></select></label><div id="places"></div><button id="draft" class="subtle">Entwurf speichern</button><button id="publish">Prüfen und veröffentlichen</button><button id="withdraw" class="danger">Veröffentlichung zurückziehen</button></section><section><h3>Offizielle Rangliste</h3><div id="standings"></div><button id="finalize" class="danger">Turnier abschliessen</button></section><section><h3>Änderungsprotokoll</h3><button id="audit-button" class="subtle">Protokoll laden</button><ol id="audit"></ol></section></section></main><script src="backend-config.js"></script><script type="module" src="admin-live.js"></script></body></html>
