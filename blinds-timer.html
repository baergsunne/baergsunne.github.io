<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c231a"><title>Bärgsunne · Blinds-Timer</title><style>
:root{--gold:#e1bd7d;--green:#142e23;--panel:#1d3b2c}*{box-sizing:border-box}body{background:#0b1c15;color:#f9f1dc;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(29px,6vw,43px);margin:9px 0}h2{font-size:23px;margin:0 0 12px}header{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #426047}a{color:var(--gold)}main{max-width:880px;margin:auto;padding:14px 12px 70px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:800}.sub{color:#c3d4c5}.card{background:var(--panel);padding:16px;border:1px solid #4b6a51;border-radius:14px;margin:12px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.button,.tabs button{border:1px solid #6b826b;background:#284635;color:#f9f1dc;padding:10px 12px;border-radius:9px;font-weight:650;min-height:44px;cursor:pointer;font:inherit}.button.primary,.tabs button.active{background:var(--gold);border-color:var(--gold);color:#142b20;font-weight:800}.button:disabled{opacity:.35}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:5px;margin:6px 0}.field span{font-size:12px;color:#caddcc}input,select{width:100%;font-size:16px;min-width:0;padding:11px;background:#fff6e9;color:#132b20;border:1px solid #98b1a1;border-radius:8px}input[type=checkbox]{width:auto}.minor{font-size:12px;color:#bdd0c1}.blindstage{background:linear-gradient(145deg,#1a3a29,#081a13);border:1px solid #987a4e;border-radius:18px;padding:14px 10px;text-align:center}.blindstage .level{font-size:12px;letter-spacing:.17em;color:var(--gold);font-weight:800}.blindstage .blinds{font-weight:900;color:#ffe0a0;font-size:clamp(66px,17vw,165px);line-height:1.04;font-variant-numeric:tabular-nums;letter-spacing:-.06em;white-space:nowrap}.blindstage .clock{font-weight:750;font-size:clamp(43px,11vw,85px);line-height:1.2;font-variant-numeric:tabular-nums}.blindstage .ante{font-size:16px;color:#d4e2d3}.controls{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:9px}.controls .button{padding:8px 10px;min-height:38px;font-size:13px}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #516b55;padding:10px 0}.line span:last-child{font-variant-numeric:tabular-nums}.fullstage{position:fixed;inset:0;z-index:999;background:#07180f;overflow:auto;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:center}.fullstage .blindstage{border:0;background:none;padding:4px}.fullstage .blinds{font-size:clamp(75px,19vw,260px)}.fullstage .clock{font-size:clamp(49px,11vw,130px)}.fullstage .controls .button{font-size:12px;min-height:34px;padding:6px}.fullstage .stage-meta{font-size:13px}.hidden{display:none!important}.notice{border-left:3px solid var(--gold);padding-left:12px;color:#d3dfd1}.pill{font-size:12px;padding:6px 9px;border-radius:30px;background:#30513d}footer{text-align:center;color:#99b7a1;padding:20px}
.chip-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0}.chip-option{padding:11px 4px;min-height:48px}.chip-option.selected{background:var(--gold);color:#142b20;font-weight:800;border-color:var(--gold)}@media(max-width:360px){.chip-options{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><a href="./#home">← Bärgsunne Poker</a><span class="eyebrow">BLINDS-TIMER · LENK</span></header><main><div class="eyebrow">BÄRGSUNNE POKER</div><h1>Blinds-Timer</h1><p class="sub">Dein privater Turniertimer – lokal auf diesem Gerät, unabhängig vom offiziellen Turnier.</p><div class="tabs"><button data-tab="settings">1. Planung</button><button data-tab="structure">2. Blindstufen</button><button data-tab="timer">3. Timer</button></div><div id="app"></div></main><footer>LOKAL · PRIVAT · KEIN LIVE-SYNC</footer><script>
(()=>{'use strict';const key='bp-standalone-blindtimer-v1',defaults=[[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[600,1200],[800,1600],[1200,2400],[2000,4000]];const base=()=>({title:'Pokerabend',players:10,stack:5000,target:150,levelMinutes:12,levels:defaults.map(([sb,bb])=>({sb,bb,ante:0,minutes:12})),breaks:[],chips:[25,100,500,1000],level:0,remaining:720,running:false,deadline:0,sound:true,completedRaces:[],races:[],racePending:null,breakPending:0,eventLog:[]});let d=base(),tab='settings',full=false,mode='level',planningMode='suggest',pendingProposal=null,pendingRaces=null,audio=null;try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.levels)&&saved.levels.length)d={...base(),...saved,running:false}}catch{}function store(){try{localStorage.setItem(key,JSON.stringify({...d,running:false}))}catch{}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.round(Number(n)||0).toLocaleString('de-CH');const time=n=>String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0');const btn=(label,act,cls='')=>'<button class="button '+cls+'" data-action="'+act+'">'+label+'</button>';const field=(k,label,v,type='number')=>'<label class="field"><span>'+label+'</span><input data-field="'+k+'" type="'+type+'" value="'+esc(v)+'"></label>';function beep(){if(!d.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=740;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}function raceCheck(chip,after){const chips=[...new Set(d.chips)].filter(x=>Number.isInteger(x)&&x>0).sort((a,b)=>a-b),remaining=chips.filter(x=>x>chip);if(!chips.includes(chip)||!remaining.length)return 'Der Chipwert muss vorhanden sein und ein grösserer Chipwert bleiben.';if(!Number.isInteger(after)||after<1||after>=d.levels.length)return 'Der Zeitpunkt muss vor dem letzten Blindlevel liegen.';const min=remaining[0];for(let i=after;i<d.levels.length;i++){const l=d.levels[i];for(const v of [l.sb,l.bb,l.ante||0])if(!Number.isInteger(v)||v<0||v%min!==0)return 'Level '+(i+1)+' benötigt '+fmt(v)+' Chips; nach dem Race sind nur Chipwerte ab '+fmt(min)+' verfügbar.';}return ''}function safeRaceTime(chip){const chips=[...new Set(d.chips)].sort((a,b)=>a-b),next=chips.find(x=>x>chip);if(!next)return null;let lastNeed=0;for(let i=0;i<d.levels.length;i++){let l=d.levels[i];if([l.sb,l.bb,l.ante||0].some(v=>v%next!==0))lastNeed=i+1;}const minimum=Math.max(3,lastNeed);for(let after=minimum;after<d.levels.length;after++){const l=d.levels[after-1];if(l.bb<next*2)continue;if(!raceCheck(chip,after))return after;}return null}function stages(){const l=d.levels[d.level]||d.levels[0],next=d.levels[d.level+1],race=d.racePending;return '<div class="blindstage"><div class="level">'+(race?'CHIP-RACE · TIMER GESTOPPT':'LEVEL '+(d.level+1)+' VON '+d.levels.length)+'</div><div class="blinds">'+(race?(race.chips||[race.chip]).map(x=>fmt(x)+'er').join(' + '):fmt(l.sb)+' / '+fmt(l.bb))+'</div><div class="ante">'+(race?'CHIPS AM TISCH WECHSELN':'SMALL BLIND / BIG BLIND'+(l.ante?' · ANTE '+fmt(l.ante):''))+'</div><div class="clock" id="remaining">'+(race?'ANGEHALTEN':time(d.remaining))+'</div><div class="stage-meta minor">'+(race?'Nach Level '+race.after+' · erst nach Erledigung fortsetzen':mode==='break'?'PAUSE':'NÄCHSTES LEVEL: '+(next?fmt(next.sb)+' / '+fmt(next.bb):'Turnierende nach Bedarf'))+'</div><div class="controls">'+(race?btn('Chip-Race erledigt · Weiter','race-done','primary'):btn('◀ Zurück','prev')+btn(d.running?'Ⅱ Pause':'▶ Start','toggle','primary')+btn('■ Stopp','stop')+btn('Weiter ▶','next')+btn('↺ Reset','reset'))+btn(full?'⤡ Schliessen':'⛶ Vollbild','fullscreen')+'</div></div>'}function timerView(){const l=d.levels[d.level];return '<div id="stage" class="'+(full?'fullstage':'')+'">'+stages()+'</div>'+(full?'':'<section class="card"><div class="row"><strong>'+esc(d.title)+'</strong><span class="pill">'+d.players+' Spieler · '+fmt(d.stack)+' Startchips</span></div><p class="minor">Tippe «Vollbild», um Blinds und Uhr möglichst gross darzustellen. Der Countdown stoppt auf Wunsch bei Pausen.</p><div class="row">'+btn('+ Pause starten','pause')+btn('Signalton testen','beep')+'</div></section><section class="card"><h2>Nächste Blindstufen</h2>'+d.levels.slice(d.level,d.level+5).map((l,i)=>'<div class="line"><span>Level '+(d.level+i+1)+'</span><span>'+fmt(l.sb)+' / '+fmt(l.bb)+' · '+l.minutes+' Min.</span></div>').join('')+'</section>')}function structureView(){let entries=[];d.levels.forEach((l,i)=>{entries.push({type:'level',index:i,level:l});d.breaks.filter(b=>b.after===i+1).forEach(b=>entries.push({type:'break',index:d.breaks.indexOf(b),item:b}));(d.races||[]).filter(r=>r.after===i+1).forEach(race=>entries.push({type:'race',index:d.races.indexOf(race),item:race}))});return '<section class="card"><h2>Blindstufen und Pausen</h2><p class="minor">Pausen stehen direkt zwischen den Blindstufen. Du kannst sie hier bearbeiten und entfernen.</p><div class="card"><h3>Alle Blindlevel gleichzeitig ändern</h3>'+field('globalMinutes','Dauer pro Blindlevel in Minuten',d.levelMinutes)+btn('Auf alle Blindlevel anwenden','apply-global','primary')+'<p class="minor">Pausen behalten ihre individuelle Dauer.</p></div>'+entries.map(x=>x.type==='race'?'<div class="line" style="display:block;border-left:4px solid var(--gold);padding-left:12px"><strong>♠ Chip-Race nach Level '+x.item.after+'</strong><p class="minor">'+fmt(x.item.chip)+'er-Chips entfernen · Timer hält automatisch an</p><div class="grid">'+field('race-plan-chip-'+x.index,'Chipwert',x.item.chip)+field('race-plan-after-'+x.index,'Nach Level',x.item.after)+'</div>'+btn('Chip-Race entfernen','del-plan-race-'+x.index)+'</div>':x.type==='level'?'<div class="line" style="display:block"><strong>Level '+(x.index+1)+'</strong><div class="grid">'+field('sb-'+x.index,'Small Blind',x.level.sb)+field('bb-'+x.index,'Big Blind',x.level.bb)+field('ante-'+x.index,'Ante',x.level.ante)+field('minutes-'+x.index,'Minuten',x.level.minutes)+'</div><div class="row">'+btn('Level entfernen','remove-'+x.index)+'</div></div>':'<div class="line" style="display:block;border-left:4px solid var(--gold);padding-left:12px"><strong>☕ Pause nach Level '+x.item.after+'</strong><div class="grid">'+field('pauseafter-'+x.index,'Nach Level',x.item.after)+field('pauseduration-'+x.index,'Dauer (Min.)',x.item.minutes)+'</div><div class="row">'+btn('Pause entfernen','delbreak-'+x.index)+'</div></div>').join('')+btn('+ Blindlevel hinzufügen','addlevel')+'</section>'}function settingsView(){let breaks=d.breaks;return '<section class="card"><h2>Turnier planen</h2><p class="minor">Wähle zuerst, wie du deine Blindstufen erstellen möchtest.</p><div class="grid"><button type="button" class="button '+(planningMode==='manual'?'primary':'')+'" data-plan="manual" aria-pressed="'+(planningMode==='manual')+'">Selber erstellen</button><button type="button" class="button '+(planningMode==='suggest'?'primary':'')+'" data-plan="suggest" aria-pressed="'+(planningMode==='suggest')+'">Vorschlagen lassen</button></div>'+field('title','Name',d.title,'text')+'<div class="grid">'+field('players','Spieler',d.players)+field('stack','Startstack',d.stack)+(planningMode==='suggest'?field('target','Zieldauer inklusive Pausen (Min.)',d.target):'')+'</div>'+(planningMode==='suggest'?'<p class="minor">Aus Spielerzahl, Startstack, verfügbaren Chipwerten und gewünschter Dauer wird eine Blindstruktur vorgeschlagen. Die tatsächliche Spieldauer hängt von den Ausscheidungen ab.</p>': '<p class="minor">Du erstellst und bearbeitest jede Blindstufe selbst. Bestehende Stufen bleiben erhalten.</p>')+'</section><section class="card"><h2>Chipwerte und Race</h2>'+'<p class="minor">Wähle alle vorhandenen Chipwerte:</p><div class="chip-options">'+[1,2,5,10,25,50,100,500,1000,5000,10000].map(v=>'<button type="button" class="button chip-option '+(d.chips.includes(v)?'selected':'')+'" data-chip="'+v+'" aria-pressed="'+d.chips.includes(v)+'">'+fmt(v)+'</button>').join('')+'</div><p class="minor">Ausgewählt: '+(d.chips.length?d.chips.map(fmt).join(' · '):'Keine Chipwerte')+'</p>'+'<p class="minor">Die App schlägt vor, kleine Chips zu entfernen, sobald sie für kommende Blinds nicht mehr gebraucht werden. Ein echtes Chip-Race muss fair am Tisch durchgeführt werden.</p>'+btn('Chip-Race-Vorschläge anzeigen','races')+'<p class="minor">'+(d.races?.length?'Übernommene Chip-Races: '+d.races.map(x=>fmt(x.chip)+'er nach Level '+x.after).join(' · '):'Noch keine Chip-Races übernommen.')+'</p>'+'</section><section class="card"><h2>Individuelle Pausen</h2>'+breaks.map((b,i)=>'<div class="line"><span>Nach Level '+b.after+' · '+b.minutes+' Min.</span>'+btn('Entfernen','delbreak-'+i)+'</div>').join('')+'<div class="grid">'+field('breakAfter','Nach Level',Math.min(d.levels.length,4))+field('breakMinutes','Dauer (Min.)',5)+'</div>'+btn('+ Pause einplanen','addbreak')+'</section><section class="card"><h2>Nächster Schritt</h2>'+(planningMode==='suggest'?btn('Blindstufen aus Angaben berechnen','generate','primary'):btn('Blindstufen selbst bearbeiten','to-structure','primary'))+'</section><section class="card"><h2>Timer speichern</h2><label class="row"><span>Signaltöne aktiv</span><input type="checkbox" data-sound '+(d.sound?'checked':'')+'></label><div class="grid">'+btn('Einstellungen exportieren','export')+btn('Gespeicherte Datei laden','import')+'</div><input class="hidden" type="file" id="import" accept="application/json,.json"><p class="minor">Automatisch lokal gespeichert. Beim Wiederöffnen startet der Timer sicherheitshalber pausiert. Ein Signal im Hintergrund ist auf iOS nicht garantiert.</p></section>'}function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.getElementById('app').innerHTML=(pendingRaces?'<section class="card"><h2>Chip-Race-Vorschläge prüfen</h2><p class="sub">Die Vorschläge werden erst nach deiner Bestätigung übernommen. Du kannst Chipwerte, Zeitpunkt und weitere Einträge selbst bestimmen.</p>'+pendingRaces.map((r,i)=>'<div class="card"><strong>Chip-Race '+(i+1)+'</strong><div class="grid">'+field('racechip-'+i,'Chipwert',r.chip)+field('raceafter-'+i,'Nach Blindlevel',r.after)+'</div>'+btn('Entfernen','remove-race-'+i)+'</div>').join('')+btn('+ Chip-Race ergänzen','add-race')+'<div class="grid">'+btn('Abbrechen','cancel-races')+btn('Übernehmen','accept-races','primary')+'</div><p class="minor">Ein Chip-Race wird am Tisch durchgeführt. Die App ersetzt keine faire Auslosung und berücksichtigt keine individuellen Restchips.</p></section>':pendingProposal?'<section class="card"><h2>Dein Blindstruktur-Vorschlag</h2><p class="sub">'+pendingProposal.levels.length+' Blindstufen à '+pendingProposal.minute+' Minuten · '+pendingProposal.pauseTime+' Minuten Pausen · insgesamt ca. '+pendingProposal.actual+' Minuten.</p><p class="minor">Dies ist eine Planung, keine garantierte Turnierdauer. Die bisherigen Stufen werden erst mit Übernehmen ersetzt.</p>'+pendingProposal.levels.map((l,i)=>'<div class="line"><span>Level '+(i+1)+'</span><span>'+fmt(l.sb)+' / '+fmt(l.bb)+'</span></div>').join('')+'<div class="grid">'+btn('Abbrechen','cancel-proposal')+btn('Übernehmen','accept-proposal','primary')+'</div></section>':tab==='timer'?timerView():tab==='structure'?structureView():settingsView());if(full&&tab!=='timer'){full=false;render()}}function advanceLevel(){const after=d.level+1;d.running=false;if(d.level>=d.levels.length-1){d.remaining=0;return;}d.level++;const pause=d.breaks.find(x=>x.after===after);d.breakPending=pause?pause.minutes:0;const races=(d.races||[]).filter(x=>x.after===after&&!raceCheck(x.chip,x.after));if(races.length){d.racePending={...races[0],chips:races.map(x=>x.chip)};d.remaining=0;mode='race';}else if(d.breakPending){mode='break';d.remaining=d.breakPending*60;d.breakPending=0;}else{mode='level';d.remaining=d.levels[d.level].minutes*60;}}function sync(){if(!d.running||d.racePending)return;d.remaining=Math.max(0,Math.ceil((d.deadline-Date.now())/1000));if(d.remaining>0)return;d.running=false;beep();if(mode==='break'){mode='level';d.remaining=d.levels[d.level].minutes*60;}else advanceLevel();store();render()}function action(a){if(a==='race-done'){if(!d.racePending)return;d.completedRaces.push({...d.racePending,doneAt:Date.now()});d.racePending=null;d.running=false;if(d.breakPending){mode='break';d.remaining=d.breakPending*60;d.breakPending=0;}else{mode='level';d.remaining=d.levels[d.level].minutes*60;}}else if(a==='apply-global'){const f=document.querySelector('[data-field="globalMinutes"]');const m=Number(f?.value);if(!Number.isFinite(m)||m<1||m>240){alert('Bitte 1 bis 240 Minuten eingeben.');return;}d.levelMinutes=m;d.levels.forEach(l=>l.minutes=m);if(!d.running)d.remaining=d.levels[d.level].minutes*60;}else if(a==='to-structure'){tab='structure'}else if(a==='toggle'){if(d.racePending)return;if(!d.remaining){d.remaining=d.levels[d.level].minutes*60}d.running=!d.running;if(d.running){d.deadline=Date.now()+d.remaining*1000;beep()}}else if(a==='stop'){d.racePending=null;d.breakPending=0;d.running=false;d.remaining=d.levels[d.level].minutes*60;mode='level'}else if(a==='prev'||a==='next'){if(d.racePending)return;d.breakPending=0;d.running=false;mode='level';d.level=Math.max(0,Math.min(d.levels.length-1,d.level+(a==='next'?1:-1)));d.remaining=d.levels[d.level].minutes*60}else if(a==='reset'){d.racePending=null;d.breakPending=0;d.running=false;mode='level';d.remaining=d.levels[d.level].minutes*60}else if(a==='fullscreen'){full=!full;if(full&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!full&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}else if(a==='beep')beep();else if(a==='pause'){d.running=false;mode='break';d.remaining=5*60}else if(a==='generate'){const pauseTime=d.breaks.reduce((n,b)=>n+b.minutes,0),available=d.target-pauseTime,start=Math.min(...d.chips.filter(v=>Number.isInteger(v)&&v>0));if(!Number.isFinite(start)||!Number.isFinite(available)||available<20||d.players<2||d.stack<1){alert('Bitte Spielerzahl, Startstack, Chipwerte und eine ausreichend lange Zieldauer eingeben.');return;}const totalChips=d.players*d.stack;const numberOfLevels=Math.max(5,Math.min(18,Math.round(available/12)));const minute=Math.max(3,Math.round(available/numberOfLevels));const n=Math.max(4,Math.round(available/minute));const startingBB=start*2,finalBB=Math.max(startingBB,totalChips/8),growth=n>1?Math.pow(finalBB/startingBB,1/(n-1)):1;let previous=0;const levels=Array.from({length:n},(_,i)=>{const intended=startingBB*Math.pow(growth,i),bb=Math.max(startingBB,Math.round(intended/(2*start))*(2*start),previous+(i?2*start:0));previous=bb;return {sb:bb/2,bb,ante:0,minutes:minute}});pendingProposal={levels,minute,pauseTime,totalChips,actual:n*minute+pauseTime};render();}else if(a==='accept-proposal'){if(!pendingProposal)return;d.running=false;d.levels=pendingProposal.levels;d.levelMinutes=pendingProposal.minute;d.level=0;d.remaining=d.levels[0].minutes*60;mode='level';pendingProposal=null;tab='structure';}else if(a==='cancel-proposal'){pendingProposal=null;}else if(a==='addlevel'){const l=d.levels.at(-1);d.levels.push({sb:l.bb,bb:l.bb*2,ante:0,minutes:d.levelMinutes})}else if(a.startsWith('remove-')){let i=Number(a.split('-')[1]);if(d.levels.length>1){d.levels.splice(i,1);d.level=Math.min(d.level,d.levels.length-1)}}else if(a==='addbreak'){let after=Number(document.querySelector('[data-field="breakAfter"]').value),minutes=Number(document.querySelector('[data-field="breakMinutes"]').value);if(after>=1&&after<d.levels.length&&minutes>0)d.breaks.push({after,minutes});else alert('Bitte ein gültiges Level und eine positive D
