<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c231a"><title>Bärgsunne · Blinds-Timer</title><style>
:root{--gold:#e1bd7d;--green:#142e23;--panel:#1d3b2c}*{box-sizing:border-box}body{background:#0b1c15;color:#f9f1dc;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(29px,6vw,43px);margin:9px 0}h2{font-size:23px;margin:0 0 12px}header{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #426047}a{color:var(--gold)}main{max-width:880px;margin:auto;padding:14px 12px 70px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:800}.sub{color:#c3d4c5}.card{background:var(--panel);padding:16px;border:1px solid #4b6a51;border-radius:14px;margin:12px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.button,.tabs button{border:1px solid #6b826b;background:#284635;color:#f9f1dc;padding:10px 12px;border-radius:9px;font-weight:650;min-height:44px;cursor:pointer;font:inherit}.button.primary,.tabs button.active{background:var(--gold);border-color:var(--gold);color:#142b20;font-weight:800}.button:disabled{opacity:.35}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:5px;margin:6px 0}.field span{font-size:12px;color:#caddcc}input,select{width:100%;font-size:16px;min-width:0;padding:11px;background:#fff6e9;color:#132b20;border:1px solid #98b1a1;border-radius:8px}input[type=checkbox]{width:auto}.minor{font-size:12px;color:#bdd0c1}.blindstage{background:linear-gradient(145deg,#1a3a29,#081a13);border:1px solid #987a4e;border-radius:18px;padding:14px 10px;text-align:center}.blindstage .level{font-size:12px;letter-spacing:.17em;color:var(--gold);font-weight:800}.blindstage .blinds{font-weight:900;color:#ffe0a0;font-size:clamp(66px,17vw,165px);line-height:1.04;font-variant-numeric:tabular-nums;letter-spacing:-.06em;white-space:nowrap}.blindstage .clock{font-weight:750;font-size:clamp(43px,11vw,85px);line-height:1.2;font-variant-numeric:tabular-nums}.blindstage .ante{font-size:16px;color:#d4e2d3}.controls{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:9px}.controls .button{padding:8px 10px;min-height:38px;font-size:13px}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #516b55;padding:10px 0}.line span:last-child{font-variant-numeric:tabular-nums}.fullstage{position:fixed;inset:0;z-index:999;background:#07180f;overflow:auto;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:center}.fullstage .blindstage{border:0;background:none;padding:4px}.fullstage .blinds{font-size:clamp(75px,19vw,260px)}.fullstage .clock{font-size:clamp(49px,11vw,130px)}.fullstage .controls .button{font-size:12px;min-height:34px;padding:6px}.fullstage .stage-meta{font-size:13px}.hidden{display:none!important}.notice{border-left:3px solid var(--gold);padding-left:12px;color:#d3dfd1}.pill{font-size:12px;padding:6px 9px;border-radius:30px;background:#30513d}footer{text-align:center;color:#99b7a1;padding:20px}
.chip-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0}.chip-option{padding:11px 4px;min-height:48px}.chip-option.selected{background:var(--gold);color:#142b20;font-weight:800;border-color:var(--gold)}@media(max-width:360px){.chip-options{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><a href="./#home">← Bärgsunne Poker</a><span class="eyebrow">BLINDS-TIMER · LENK</span></header><main><div class="eyebrow">BÄRGSUNNE POKER</div><h1>Blinds-Timer</h1><p class="sub">Dein privater Turniertimer – lokal auf diesem Gerät, unabhängig vom offiziellen Turnier.</p><div class="tabs"><button data-tab="settings">1. Planung</button><button data-tab="structure">2. Blindstufen</button><button data-tab="timer">3. Timer</button></div><div id="app"></div></main><footer>LOKAL · PRIVAT · KEIN LIVE-SYNC</footer><script>
(()=>{'use strict';const key='bp-standalone-blindtimer-v1',defaults=[[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[600,1200],[800,1600],[1200,2400],[2000,4000]];const base=()=>({title:'Pokerabend',players:10,stack:5000,target:150,levelMinutes:12,levels:defaults.map(([sb,bb])=>({sb,bb,ante:0,minutes:12})),breaks:[],chips:[25,100,500,1000],level:0,remaining:720,running:false,deadline:0,sound:true,completedRaces:[],eventLog:[]});let d=base(),tab='settings',full=false,mode='level',planningMode='suggest',audio=null;try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.levels)&&saved.levels.length)d={...base(),...saved,running:false}}catch{}function store(){try{localStorage.setItem(key,JSON.stringify({...d,running:false}))}catch{}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.round(Number(n)||0).toLocaleString('de-CH');const time=n=>String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0');const btn=(label,act,cls='')=>'<button class="button '+cls+'" data-action="'+act+'">'+label+'</button>';const field=(k,label,v,type='number')=>'<label class="field"><span>'+label+'</span><input data-field="'+k+'" type="'+type+'" value="'+esc(v)+'"></label>';function beep(){if(!d.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=740;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}function stages(){const l=d.levels[d.level]||d.levels[0],next=d.levels[d.level+1];return '<div class="blindstage"><div class="level">LEVEL '+(d.level+1)+' VON '+d.levels.length+'</div><div class="blinds">'+fmt(l.sb)+' / '+fmt(l.bb)+'</div><div class="ante">SMALL BLIND / BIG BLIND'+(l.ante?' · ANTE '+fmt(l.ante):'')+'</div><div class="clock" id="remaining">'+time(d.remaining)+'</div><div class="stage-meta minor">'+(mode==='break'?'PAUSE':'NÄCHSTES LEVEL: '+(next?fmt(next.sb)+' / '+fmt(next.bb):'Turnierende nach Bedarf'))+'</div><div class="controls">'+btn('◀ Zurück','prev')+btn(d.running?'Ⅱ Pause':'▶ Start','toggle','primary')+btn('■ Stopp','stop')+btn('Weiter ▶','next')+btn('↺ Reset','reset')+btn(full?'⤡ Schliessen':'⛶ Vollbild','fullscreen')+'</div></div>'}function timerView(){const l=d.levels[d.level];return '<div id="stage" class="'+(full?'fullstage':'')+'">'+stages()+'</div>'+(full?'':'<section class="card"><div class="row"><strong>'+esc(d.title)+'</strong><span class="pill">'+d.players+' Spieler · '+fmt(d.stack)+' Startchips</span></div><p class="minor">Tippe «Vollbild», um Blinds und Uhr möglichst gross darzustellen. Der Countdown stoppt auf Wunsch bei Pausen.</p><div class="row">'+btn('+ Pause starten','pause')+btn('Signalton testen','beep')+'</div></section><section class="card"><h2>Nächste Blindstufen</h2>'+d.levels.slice(d.level,d.level+5).map((l,i)=>'<div class="line"><span>Level '+(d.level+i+1)+'</span><span>'+fmt(l.sb)+' / '+fmt(l.bb)+' · '+l.minutes+' Min.</span></div>').join('')+'</section>')}function structureView(){return '<section class="card"><h2>Blindstufen bearbeiten</h2><p class="minor">Jede Stufe individuell anpassen. Änderungen bleiben auf deinem Gerät.</p>'+d.levels.map((l,i)=>'<div class="line" style="display:block"><strong>Level '+(i+1)+'</strong><div class="grid">'+field('sb-'+i,'Small Blind',l.sb)+field('bb-'+i,'Big Blind',l.bb)+field('ante-'+i,'Ante',l.ante)+field('minutes-'+i,'Minuten',l.minutes)+'</div><div class="row">'+btn('Level entfernen','remove-'+i)+'</div></div>').join('')+btn('+ Blindlevel hinzufügen','addlevel')+'</section>'}function settingsView(){let breaks=d.breaks;return '<section class="card"><h2>Turnier planen</h2><p class="minor">Wähle zuerst, wie du deine Blindstufen erstellen möchtest.</p><div class="grid"><button type="button" class="button '+(planningMode==='manual'?'primary':'')+'" data-plan="manual" aria-pressed="'+(planningMode==='manual')+'">Selber erstellen</button><button type="button" class="button '+(planningMode==='suggest'?'primary':'')+'" data-plan="suggest" aria-pressed="'+(planningMode==='suggest')+'">Vorschlagen lassen</button></div>'+field('title','Name',d.title,'text')+'<div class="grid">'+field('players','Spieler',d.players)+field('stack','Startstack',d.stack)+field('target','Zieldauer inklusive Pausen (Min.)',d.target)+field('levelMinutes','Leveldauer (Min.)',d.levelMinutes)+'</div>'+(planningMode==='suggest'?'<p class="minor">Aus Spielerzahl, Startstack, verfügbaren Chipwerten und gewünschter Dauer wird eine Blindstruktur vorgeschlagen. Die tatsächliche Spieldauer hängt von den Ausscheidungen ab.</p>': '<p class="minor">Du erstellst und bearbeitest jede Blindstufe selbst. Bestehende Stufen bleiben erhalten.</p>')+'</section><section class="card"><h2>Chipwerte und Race</h2>'+'<p class="minor">Wähle alle vorhandenen Chipwerte:</p><div class="chip-options">'+[1,2,5,10,25,50,100,500,1000,5000,10000].map(v=>'<button type="button" class="button chip-option '+(d.chips.includes(v)?'selected':'')+'" data-chip="'+v+'" aria-pressed="'+d.chips.includes(v)+'">'+fmt(v)+'</button>').join('')+'</div><p class="minor">Ausgewählt: '+(d.chips.length?d.chips.map(fmt).join(' · '):'Keine Chipwerte')+'</p>'+'<p class="minor">Die App schlägt vor, kleine Chips zu entfernen, sobald sie für kommende Blinds nicht mehr gebraucht werden. Ein echtes Chip-Race muss fair am Tisch durchgeführt werden.</p>'+btn('Chip-Race-Vorschläge anzeigen','races')+'</section><section class="card"><h2>Individuelle Pausen</h2>'+breaks.map((b,i)=>'<div class="line"><span>Nach Level '+b.after+' · '+b.minutes+' Min.</span>'+btn('Entfernen','delbreak-'+i)+'</div>').join('')+'<div class="grid">'+field('breakAfter','Nach Level',Math.min(d.levels.length,4))+field('breakMinutes','Dauer (Min.)',5)+'</div>'+btn('+ Pause einplanen','addbreak')+'</section><section class="card"><h2>Nächster Schritt</h2>'+(planningMode==='suggest'?btn('Blindstufen aus Angaben berechnen','generate','primary'):btn('Blindstufen selbst bearbeiten','to-structure','primary'))+'</section><section class="card"><h2>Timer speichern</h2><label class="row"><span>Signaltöne aktiv</span><input type="checkbox" data-sound '+(d.sound?'checked':'')+'></label><div class="grid">'+btn('Einstellungen exportieren','export')+btn('Gespeicherte Datei laden','import')+'</div><input class="hidden" type="file" id="import" accept="application/json,.json"><p class="minor">Automatisch lokal gespeichert. Beim Wiederöffnen startet der Timer sicherheitshalber pausiert. Ein Signal im Hintergrund ist auf iOS nicht garantiert.</p></section>'}function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.getElementById('app').innerHTML=tab==='timer'?timerView():tab==='structure'?structureView():settingsView();if(full&&tab!=='timer'){full=false;render()}}function sync(){if(!d.running)return;d.remaining=Math.max(0,Math.ceil((d.deadline-Date.now())/1000));if(d.remaining>0)return;d.running=false;beep();if(mode==='break'){mode='level';d.remaining=d.levels[d.level].minutes*60}else{const b=d.breaks.find(x=>x.after===d.level+1);if(d.level<d.levels.length-1){d.level++;if(b){mode='break';d.remaining=b.minutes*60}else{mode='level';d.remaining=d.levels[d.level].minutes*60}}else d.remaining=0}store();render()}function action(a){if(a==='to-structure'){tab='structure'}else if(a==='toggle'){if(!d.remaining){d.remaining=d.levels[d.level].minutes*60}d.running=!d.running;if(d.running){d.deadline=Date.now()+d.remaining*1000;beep()}}else if(a==='stop'){d.running=false;d.remaining=d.levels[d.level].minutes*60;mode='level'}else if(a==='prev'||a==='next'){d.running=false;mode='level';d.level=Math.max(0,Math.min(d.levels.length-1,d.level+(a==='next'?1:-1)));d.remaining=d.levels[d.level].minutes*60}else if(a==='reset'){d.running=false;mode='level';d.remaining=d.levels[d.level].minutes*60}else if(a==='fullscreen'){full=!full;if(full&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!full&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}else if(a==='beep')beep();else if(a==='pause'){d.running=false;mode='break';d.remaining=5*60}else if(a==='generate'){d.running=false;let pauseTime=d.breaks.reduce((n,b)=>n+b.minutes,0),available=Math.max(30,d.target-pauseTime),minute=Math.max(3,d.levelMinutes),n=Math.max(4,Math.ceil(available/minute)),start=Math.max(2,Math.round(d.stack/100/5)*5),bb=start*2;d.levels=Array.from({length:n},(_,i)=>{let cur=Math.round(bb*Math.pow(1.52,i)/5)*5;return {sb:Math.max(1,Math.round(cur/2/5)*5),bb:cur,ante:0,minutes:minute}});d.level=0;d.remaining=minute*60;tab='structure';alert('Blindstruktur erstellt: '+n+' Stufen à '+minute+' Minuten. Prüfe und bearbeite sie im nächsten Schritt.')}else if(a==='addlevel'){const l=d.levels.at(-1);d.levels.push({sb:l.bb,bb:l.bb*2,ante:0,minutes:d.levelMinutes})}else if(a.startsWith('remove-')){let i=Number(a.split('-')[1]);if(d.levels.length>1){d.levels.splice(i,1);d.level=Math.min(d.level,d.levels.length-1)}}else if(a==='addbreak'){let after=Number(document.querySelector('[data-field="breakAfter"]').value),minutes=Number(document.querySelector('[data-field="breakMinutes"]').value);if(after>=1&&after<d.levels.length&&minutes>0)d.breaks.push({after,minutes});else alert('Bitte ein gültiges Level und eine positive Dauer wählen.')}else if(a.startsWith('delbreak-'))d.breaks.splice(Number(a.split('-')[1]),1);else if(a==='races'){let available=d.chips.slice().sort((x,y)=>x-y);let msg=available.slice(0,-1).map(c=>{let lvl=d.levels.findIndex(l=>l.sb>c&&l.bb>c&&l.sb%c===0&&l.bb%c===0);return c+'er: '+(lvl>=0?'ab Level '+(lvl+1)+' Umwechslung prüfen':'kein sicherer Zeitpunkt automatisch ermittelt')}).join('\n');alert(msg||'Keine Vorschläge.')}else if(a==='export'){let blob=new Blob([JSON.stringify({format:'baergsunne-blinds-v1',settings:{...d,running:false}},null,2)],{type:'application/json'}),el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download='baergsunne-blinds-timer.json';el.click();setTimeout(()=>URL.revokeObjectURL(el.href),1500)}else if(a==='import')document.getElementById('import').click();store();render()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.chip!==undefined){let v=Number(b.dataset.chip);d.chips=d.chips.includes(v)?d.chips.filter(x=>x!==v):[...d.chips,v].sort((a,b)=>a-b);store();render();return;}if(b.dataset.plan){planningMode=b.dataset.plan;render();return}if(b.dataset.tab){tab=b.dataset.tab;full=false;render()}else if(b.dataset.action)action(b.dataset.action)});document.addEventListener('change',async e=>{let x=e.target;if(x.dataset.field){let k=x.dataset.field;if(/^(sb|bb|ante|minutes)-\d+$/.test(k)){let [name,i]=k.split('-');d.levels[+i][name]=Math.max(name==='ante'?0:1,Number(x.value)||0)}else if(['title','players','stack','target','levelMinutes'].includes(k)){d[k]=k==='title'?x.value:Math.max(1,Number(x.value)||1)}}else if(x.dataset.sound!==undefined)d.sound=x.checked;else if(x.id==='import'&&x.files?.[0]){try{let o=JSON.parse(await x.files[0].text());if(o.format!=='baergsunne-blinds-v1'||!Array.isArray(o.settings?.levels)||!o.settings.levels.length)throw Error('Dateiformat');if(!confirm('Bestehende Timer-Einstellungen durch die Datei ersetzen?'))return;d={...base(),...o.settings,running:false};mode='level'}catch(err){alert('Import fehlgeschlagen: '+err.message)}}store();render()});setInterval(()=>{sync();if(d.running){let node=document.getElementById('remaining');if(node)node.textContent=time(d.remaining);if(d.remaining%10===0)store()}},500);render()})();
</script></body></html>
