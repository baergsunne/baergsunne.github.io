name = "baergsunne-live-private-preview"
main = "live/worker.js"
compatibility_date = "2026-10-15"
workers_dev = true

[assets]
directory = "./dist-live"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin.html", "/setup.html"]

[[d1_databases]]
binding = "DB"
database_name = "baergsunne-live-private-preview"
database_id = "FILL_ONLY_AFTER_OWNER_APPROVAL"
migrations_dir = "live/migrations"
