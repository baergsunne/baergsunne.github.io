# ISOLATED TEST ONLY – do not deploy without Free-plan and budget verification.
# This file must NEVER contain real secrets. Use Cloudflare secret bindings on the private Worker.
name = "baergsunne-profi-private-preview"
main = "live/worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
PREVIEW_REQUIRED = "true"

[assets]
directory = "./dist-live"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin.html", "/setup.html", "/profi-live-admin.html", "/watch.html", "/watch.js", "/live/profi-clock.js"]

[[d1_databases]]
binding = "DB"
database_name = "baergsunne-profi-private-preview"
database_id = "FILL_WITH_SEPARATE_TEST_DATABASE_ID"
migrations_dir = "live/migrations"

# Only SQLite-backed Durable Objects are available on Workers Free.
[[durable_objects.bindings]]
name = "PROFI_EVENTS"
class_name = "ProfiEvents"

[[migrations]]
tag = "profi-live-events-v1"
new_sqlite_classes = ["ProfiEvents"]

# Manually configure private secrets before any isolated preview deployment:
# PREVIEW_GATE_SECRET (non-empty), RATE_SALT, PROFI_VIEWER_SECRET (>=32 chars),
# and the owner's existing separate admin-login setup on the isolated D1.
# Never connect this file to production D1; no automatic GitHub CI deployment.
