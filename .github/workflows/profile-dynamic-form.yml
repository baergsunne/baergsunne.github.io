name: Player form interactive regression
on:
  pull_request:
    paths:
      - 'profile-form.js'
      - 'profile-form.css'
      - 'app.js'
      - 'index.html'
      - 'tests/profile-dynamic-form.cjs'
      - '.github/workflows/profile-dynamic-form.yml'
jobs:
  player-form:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check profile-form.js && node --check app.js && node --check tests/profile-dynamic-form.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/poker-form-server.log 2>&1 &
      - run: node tests/profile-dynamic-form.cjs
