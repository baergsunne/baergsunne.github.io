name: Hall recordbook tiles regression
on:
  pull_request:
    paths:
      - 'app.js'
      - 'hall-records.js'
      - 'hall-unified-design.css'
      - 'index.html'
      - 'tests/hall-recordbook-tiles.cjs'
      - '.github/workflows/hall-recordbook-tiles.yml'
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/poker-hall-server.log 2>&1 &
      - run: node --check app.js && node --check hall-records.js
      - run: node tests/hall-recordbook-tiles.cjs
