name: Hall shared choice production HTTP smoke
on:
  pull_request:
    paths:
      - 'tests/hof-shared-choice-live-http.cjs'
      - '.github/workflows/hof-shared-choice-live-http.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/hof-shared-choice-live-http.cjs
      - run: node tests/hof-shared-choice-live-http.cjs
