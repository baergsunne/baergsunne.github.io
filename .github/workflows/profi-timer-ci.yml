name: Profi-Timer Isolated CI
on:
  push:
    branches:
      - feature/profi-timer-zwei-betriebsarten-20261021
      - feature/profi-timer-main-safe-20261021
      - feature/profi-timer-preview-main-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new JavaScript files
        run: |
          node --check live/profi-api.js
          node --check live/profi-core.js
          node --check live/profi-clock.js
          node --check live/profi-events.js
          node --check live/worker.js
          node --check profi-qr.js
          node --check profi-live-admin.js
          node --check watch.js
      - name: Test existing championship and professional timer
        run: |
          node --test live/*.test.js
          node tests/profi-timer-demo.cjs
          node --test test-live-push-safety.cjs
      - name: Build isolated preview assets and Worker module
        run: |
          npm run build:preview
          node --check dist-live-preview-worker.mjs
          test -s dist-live/profi-live-admin.html
          test -s dist-live/watch.html

  browser-qa:
    name: Real Chrome Browser QA
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Run smartphone-view and desktop security smoke tests
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then echo "Chrome unavailable in runner"; exit 1; fi
          CHROME_PATH="$CHROME_PATH" node tests/profi-browser-smoke.cjs
      - name: Keep temporary mobile screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profi-timer-mobile-qa
          path: browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
