name: Browser statistics audit
on:
  push:
    branches:
      - fix/statistics-chart-integrity-20261018
  pull_request:
    paths:
      - 'app.js'
      - 'data.js'
      - 'index.html'
      - 'tests/browser-audit.cjs'
      - '.github/workflows/browser-statistics-audit.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/poker-server.log 2>&1 & 
      - run: node tests/browser-audit.cjs
      - run: node tests/real-cloudflare-audit.cjs
      - run: node tests/all-pages-audit.cjs
