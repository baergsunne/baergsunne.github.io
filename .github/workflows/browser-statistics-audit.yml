name: Browser statistics audit
on:
  push:
    branches:
      - feat/keymoments-round-carousel-20261019
      - feat/keymoments-premium-cards-20261019
  pull_request:
    paths:
      - 'app.js'
      - 'discovery-home.css'
      - 'championship-live.js'
      - 'championship-live.css'
      - 'tests/hero-trophy-regression.cjs'
      - 'race-sticky-navigation.css'
      - 'tests/race-sticky-navigation.cjs'
      - 'duel-butterfly.css'
      - 'tests/duel-mobile-usability.cjs'
      - 'data.js'
      - 'index.html'
      - 'mobile-controlled-density.css'
      - 'tests/mobile-bottomnav-grid-alignment.cjs'
      - 'tests/mobile-controlled-density.cjs'
      - 'heritage-global-layers.css'
      - 'tests/global-heritage-layers.cjs'
      - 'stats-tool-card-depth.css'
      - 'tests/stats-tool-card-depth.cjs'
      - 'stats-table-personalization.js'
      - 'stats-table-personalization.css'
      - 'tests/stats-column-personalization.cjs'
      - 'history-chronicle.js'
      - 'history-chronicle.css'
      - 'history-deep-dive.js'
      - 'history-deep-dive.css'
      - 'tests/history-seven-perspectives.cjs'
      - 'tests/yearbook-highlights-dna.cjs'
      - 'tests/history-record-stories.cjs'
      - 'tests/history-insight-carousel-peek.cjs'
      - 'tests/history-six-visual-unity.cjs'
      - 'history-unified-design.css'
      - 'tests/history-sticky-slider.cjs'
      - 'tests/history-step-buttons.cjs'
      - 'tests/home-history-teaser.cjs'
      - 'tests/history-statistics-tiles.cjs'
      - 'open-pages.css'
      - 'tests/open-pages-layout.cjs'
      - 'tests/key-moments-carousel.cjs'
      - 'tests/browser-audit.cjs'
      - '.github/workflows/browser-statistics-audit.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/poker-server.log 2>&1 & 
      - run: node tests/browser-audit.cjs
      - run: node tests/hero-trophy-regression.cjs
      - run: node tests/mobile-controlled-density.cjs
      - run: node tests/mobile-bottomnav-grid-alignment.cjs
      - run: node tests/global-heritage-layers.cjs
      - run: node tests/race-sticky-navigation.cjs
      - run: node tests/duel-mobile-usability.cjs
      - run: node tests/stats-column-personalization.cjs
      - run: node tests/stats-tool-card-depth.cjs
      - run: node tests/real-cloudflare-audit.cjs
      - run: node tests/all-pages-audit.cjs
      - run: node tests/chart-values-integrity.cjs
      - run: node tests/profile-toolbar-audit.cjs
      - run: node tests/profile-card-order.cjs
      - run: node tests/profile-personalized-explanations.cjs
      - run: node tests/mobile-dropdowns.cjs
      - run: node tests/yearbook-responsive.cjs
      - run: node tests/yearbook-finger-drag.cjs
      - run: node tests/replay-carousel.cjs
      - run: node tests/key-moments-carousel.cjs
      - run: node tests/history-seven-perspectives.cjs
      - run: node tests/yearbook-highlights-dna.cjs
      - run: node tests/history-record-stories.cjs
      - run: node tests/history-insight-carousel-peek.cjs
      - run: node tests/history-six-visual-unity.cjs
      - run: node tests/history-sticky-slider.cjs
      - run: node tests/history-step-buttons.cjs
      - run: node tests/home-history-teaser.cjs
      - run: node tests/history-statistics-tiles.cjs
      - run: node tests/open-pages-layout.cjs
