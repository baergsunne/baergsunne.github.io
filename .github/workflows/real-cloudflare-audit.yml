name: Real Cloudflare archive browser audit
on:
  push:
    branches:
      - audit/statistics-2026-20261018
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/poker-server.log 2>&1 &
      - run: node tests/real-cloudflare-audit.cjs
