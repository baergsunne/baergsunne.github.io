name: Admin live read-only HTTP smoke
on:
  push:
    branches:
      - ops/admin-http-smoke-20261025
  pull_request:
    paths:
      - 'tests/admin-live-http-smoke.cjs'
      - '.github/workflows/admin-live-http-smoke.yml'
jobs:
  live-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/admin-live-http-smoke.cjs
      - run: node tests/admin-live-http-smoke.cjs
