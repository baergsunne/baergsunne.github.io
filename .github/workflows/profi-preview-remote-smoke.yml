name: Private Profi-Timer HTTPS Security Smoke
on:
  push:
    branches:
      - feature/profi-timer-preview-main-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check isolated preview URL without any credentials
        env:
          BASE: https://baergsunne-profi-timer-preview-20261028.baergsunne-poker-2026.workers.dev
        run: |
          set -euo pipefail
          page="$(curl -fLsS --connect-timeout 10 --max-time 25 "$BASE/")"
          echo "$page" | grep -q 'Private Bärgsunne Vorschau'
          admin="$(curl -fLsS --connect-timeout 10 --max-time 25 "$BASE/profi-live-admin.html")"
          echo "$admin" | grep -q 'Private Bärgsunne Vorschau'
          status="$(curl -sS -o /tmp/watch-invalid.txt -w '%{http_code}' "$BASE/api/profi/watch?id=00000000000000000000000000000000")"
          test "$status" = 403
          spectator="$(curl -fLsS --connect-timeout 10 --max-time 25 "$BASE/watch.html")"
          echo "$spectator" | grep -q 'Live-Turnier'
          if echo "$spectator" | grep -q '/admin.html'; then exit 1; fi
          echo 'PASS: HTTPS reachable; preview is locked; anonymous spectators cannot read session data.'
