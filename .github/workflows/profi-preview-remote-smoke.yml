name: Private Profi-Timer HTTPS Security Smoke
on:
  push:
    branches: [feature/profi-timer-preview-main-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Assert private gate, neutral spectator assets, and viewer token security
        shell: bash
        env:
          BASE: https://baergsunne-profi-timer-preview-20261028.baergsunne-poker-2026.workers.dev
        run: |
          set -euo pipefail
          for path in / /profi-live-admin.html /setup.html /api/profi/list; do
            http="$(curl -sS -o /tmp/locked -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE$path")"
            test "$http" = 401
            grep -q 'Private Bärgsunne Vorschau' /tmp/locked
            echo "PASS: $path protected (401)"
          done
          for path in /watch.html /watch.js /live/profi-clock.js; do
            http="$(curl -sS -o /tmp/public -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE$path")"
            test "$http" = 200
            test -s /tmp/public
            echo "PASS: $path reachable (200)"
          done
          http="$(curl -sS -o /tmp/blocked -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE/api/profi/watch?id=00000000000000000000000000000000")"
          test "$http" = 403
          grep -q 'Zugriff verweigert' /tmp/blocked
          echo "PASS: anonymous API 403 and no spectator data exposed"
