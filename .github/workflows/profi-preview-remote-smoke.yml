name: Private Profi-Timer HTTPS Security Smoke
on:
  push:
    branches: [feature/profi-timer-preview-main-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose HTTPS response and confirm private access gate
        shell: bash
        env:
          BASE: https://baergsunne-profi-timer-preview-20261028.baergsunne-poker-2026.workers.dev
          OLD: https://baergsunne-blinds-timer-preview-20261017.baergsunne-poker-2026.workers.dev
        run: |
          set -euo pipefail
          for p in / /watch.html /api/profi/watch?id=00000000000000000000000000000000; do
            response="$(curl -sS --connect-timeout 10 --max-time 20 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$BASE$p")"
            echo "PATH $p HTTP $response"
            grep -iE '^(server:|content-type:|www-authenticate:|location:|cf-ray:|x-robots-tag:|cf-access:)' /tmp/headers || true
            echo -n 'Body snippet: '; head -c 250 /tmp/body | tr '\n' ' '; echo
          done
          oldcode="$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$OLD/")"
          echo "OLDER PREVIEW ROOT STATUS $oldcode"
          rootcode="$(curl -sS --connect-timeout 10 --max-time 20 -D /tmp/rootheaders -o /tmp/rootbody -w '%{http_code}' "$BASE/")"
          case "$rootcode" in
            200) grep -q 'Private Bärgsunne Vorschau' /tmp/rootbody ;;
            401|403) echo 'Preview remains access-protected at edge; owner access diagnosis required.' ;;
            *) exit 1 ;;
          esac
