name: Anonymous Profi-Demo HTTPS Safety Gate
on:
  push:
    branches: [feature/profi-timer-preview-main-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify passwordless demo and locked real administration
        shell: bash
        env:
          BASE: https://baergsunne-profi-timer-preview-20261028.baergsunne-poker-2026.workers.dev
        run: |
          set -euo pipefail
          for p in /profi-demo.html /profi-demo.js /profi-qr.js /watch.html /watch.js /live/profi-clock.js; do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/page -w '%{http_code}' "$BASE$p")"
            test "$code" = 200
            test -s /tmp/page
            echo "PASS: Public demo asset $p"
          done
          curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/" | grep -q 'OHNE ANMELDUNG'
          echo 'PASS: Root opens the demo without a gate'
          for p in /api/admin/years /profi-live-admin.html /setup.html /api/profi/state; do
            code="$(curl -sS -o /tmp/blocked -w '%{http_code}' "$BASE$p")"
            test "$code" = 403
            echo "PASS: Privileged route $p blocked"
          done
          code="$(curl -sS -o /tmp/blocked -w '%{http_code}' "$BASE/api/profi/watch?id=00000000000000000000000000000000")"
          test "$code" = 403
          echo 'PASS: Spectator API inaccessible without valid QR token'
