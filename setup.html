<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081510"><title>Bärgsunne Poker · Erstinitialisierung</title><link rel="stylesheet" href="style.css?v=1.3.0"><script src="backend-config.js?v=1.3.0"></script><style>body{background:#081510;color:#f5f7f1}main{max-width:520px;margin:3rem auto;padding:20px}.set{padding:23px;border:1px solid #54725b;border-radius:23px;background:#173024}label{display:block;margin:16px 0}input{display:block;background:#254632;color:white;border:1px solid #64826a;border-radius:12px;padding:13px;width:100%;font-size:16px}button{background:#e8c37e;color:#102719;border:0;border-radius:12px;padding:13px 22px;font-weight:800}.warn{color:#efcf8e;line-height:1.6}a{color:#e8c37e}</style></head><body><main><a href="./">← Startseite</a><h1>♠ Admin-Ersteinrichtung</h1><div class="set"><p class="warn">Diese Seite funktioniert erst nach Einrichtung des isolierten Servers. Das Initialisierungs-Secret wird nicht gespeichert. Es muss anschliessend in Cloudflare gelöscht werden.</p><form id="setup"><label>Initialisierungs-Secret (aus Cloudflare)<input type="password" id="bootstrap" autocomplete="off" required></label><label>Erster Admin-Benutzername<input id="user" required minlength="3"></label><label>Admin-Passwort (mindestens 14 Zeichen)<input id="pass" type="password" required minlength="14" autocomplete="new-password"></label><button>Ersten Admin anlegen</button></form><p id="message" role="status"></p></div></main><script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('message'),api=(window.BAERGSUNNE_API_URL||'').replace(/\/$/,'');if(!api.startsWith('https://')){out.textContent='Der isolierte Server ist noch nicht konfiguriert.';return}try{const r=await fetch(api+'/api/setup',{method:'POST',headers:{'Content-Type':'application/json','x-bootstrap-token':document.getElementById('bootstrap').value},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const x=await r.json();if(!r.ok)throw Error(x.error||'Fehler');out.textContent='Erster Administrator angelegt! WICHTIG: Jetzt BOOTSTRAP_TOKEN in Cloudflare entfernen. Danach admin.html öffnen.';e.target.reset()}catch(err){out.textContent='Fehler: '+err.message}});</script></body></html>
