<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b21"><title>Mein Poker-Universum · Bärgsunne Poker</title><style>
:root{--accent:#dfba7f;--bg:#10291f;--pane:#203c30;--text:#fbf4e7}*{box-sizing:border-box}body{margin:0;background:#0b1d16;color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{padding:17px 18px;background:#102b21;border-bottom:1px solid #54725c;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:var(--accent)}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(28px,7vw,44px);margin:10px 0}h2{font-size:25px;margin:0 0 12px}h3{margin:4px 0 10px}main{max-width:900px;margin:auto;padding:20px 14px 90px}.eyebrow{color:var(--accent);letter-spacing:.16em;font-size:11px;font-weight:800}.hero{text-align:center;padding:30px 10px}.sub{color:#c4d7c9;line-height:1.5}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}.tabs button,.button{border:1px solid #65816c;background:var(--pane);color:var(--text);border-radius:10px;min-height:43px;padding:11px;font-weight:650;cursor:pointer}.tabs button.active,.button.primary{background:var(--accent);color:#13271c;border-color:var(--accent)}.button:disabled{opacity:.4}.card{background:var(--pane);border:1px solid #4a6854;border-radius:15px;padding:16px;margin:13px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields{display:grid;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field span{font-size:12px;color:#d8e2d8}input,select{width:100%;background:#f8f1e7;color:#183427;border:1px solid #9cad9d;border-radius:8px;padding:12px;font-size:16px;min-width:0}input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.25)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}.wrap{flex-wrap:wrap}.pill{background:#375844;padding:5px 9px;border-radius:50px;font-size:12px}.small{font-size:12px;color:#c8d8cb}.wide{width:100%}.muted{opacity:.7}button{font:inherit}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #54705b}.danger{border-color:#a97777;color:#ffd6c7}.stat{background:#31513f;padding:12px;border-radius:10px;text-align:center}.stat b{display:block;font-size:25px;color:var(--accent)}.swatch{height:34px;width:34px;min-height:34px;padding:0;border:2px solid #fff;border-radius:50%}.hidden{display:none!important}footer{text-align:center;color:#9ab5a3;padding:25px}.empty{padding:20px;text-align:center;color:#c5d8c7}.note{border-left:3px solid var(--accent);padding-left:12px;color:#cadbcd}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #50705b;padding:10px 5px}th:last-child,td:last-child{text-align:right}@media(min-width:700px){.tabs{grid-template-columns:repeat(6,1fr)}}
</style></head><body><header><a href="./#home" aria-label="Zurück zu Bärgsunne Poker">← Bärgsunne Poker</a><span class="eyebrow">PRIVATER BAUKASTEN</span></header><main><div class="hero"><div class="eyebrow">DEINE SPIELER · DEINE GESCHICHTE</div><h1>Mein Poker-Universum</h1><p class="sub">Erstelle deine eigene Poker-Welt. Alle Daten bleiben auf diesem Gerät.</p></div><div id="app"></div></main><footer>PRIVATE TURNIERE · KEINE CLOUD-SPEICHERUNG · BÄRGSUNNE POKER</footer>
<script>
(()=>{'use strict';const KEY='bp-private-universes-v1';let db={active:null,universes:[]},tab='home',timer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.universes))db=v}catch(e){}const active=()=>db.universes.find(x=>x.id===db.active);const uuid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Speichern nicht möglich. Bitte Speicherplatz prüfen und ein Backup erstellen.')}};const fmt=n=>Math.round(n).toLocaleString('de-CH');const nav=['Start','Turnier','Spieler','Historie','Statistik','Gestalten'],ids=['home','tournament','players','history','stats','design'];const mods=[['timer','Blinds-Timer'],['blindgen','Blindstruktur-Generator'],['breaks','Individuelle Pausen'],['races','Chip-Races'],['eliminations','Ausscheidungen'],['seats','Sitzplätze'],['rebuys','Rebuys und Add-ons'],['rankings','Ewige Rangliste'],['duels','Spieler-Duell'],['hall','Hall of Fame'],['archive','Turnierhistorie'],['reports','Turnierberichte']];const defaults=['timer','blindgen','breaks','races','eliminations','rankings','duels','hall','archive'];const colors=['#dfba7f','#79badb','#efae9c','#a7dbac','#cba3f4'];const field=(n,v,type='text')=>'<label class="field"><span>'+esc(n)+'</span><input data-field="'+esc(n)+'" type="'+type+'" value="'+esc(v)+'"></label>';const btn=(label,act,extra='')=>'<button class="button '+extra+'" data-action="'+act+'">'+label+'</button>';function render(){let u=active();document.documentElement.style.setProperty('--accent',u?.accent||'#dfba7f');document.title=(u?.name||'Mein Poker-Universum')+' · Bärgsunne Poker';let html='';if(!u){html='<section class="card"><h2>Dein erstes Universum</h2><p class="sub">Lege ein lokales Profil an. Keine Registrierung, keine Datenübertragung.</p>'+field('Profilname','')+field('Universumsname','')+btn('Universum erstellen','create','primary wide')+'</section>';}else{html='<div class="row wrap"><strong>'+esc(u.name)+'</strong><span class="pill">Profil: '+esc(u.owner)+'</span></div><nav class="tabs" aria-label="Universum-Navigation">'+nav.map((x,i)=>'<button data-tab="'+ids[i]+'" class="'+(tab===ids[i]?'active':'')+'">'+esc(x)+'</button>').join('')+'</nav>';html+=views[tab]?.(u)||views.home(u);}document.getElementById('app').innerHTML=html;}
const views={home:u=>'<section class="card"><h2>'+esc(u.name)+'</h2><p class="sub">Gestalte deine eigene Poker-Geschichte.</p><div class="grid"><div class="stat"><b>'+u.players.length+'</b>Spieler</div><div class="stat"><b>'+u.tournaments.length+'</b>Turniere</div></div></section><section class="card"><h3>Deine Werkzeuge</h3><div class="grid">'+[['tournament','Turniermanager'],['players','Spieler'],['history','Historie'],['stats','Statistiken'],['design','Baukasten']].map(([id,t])=>'<button class="button" data-tab="'+id+'">'+t+'</button>').join('')+'</div></section><section class="card"><h3>Meine Universen</h3>'+db.universes.map(x=>'<div class="listrow"><span>'+esc(x.name)+'</span><button class="button" data-switch="'+esc(x.id)+'">'+(x.id===u.id?'Aktiv':'Öffnen')+'</button></div>').join('')+btn('Weiteres Universum erstellen','add')+'</section><p class="note">Deine lokalen Daten können beim Löschen der Browserdaten verloren gehen. Erstelle regelmässig ein Backup.</p>'+btn('Backup exportieren','export','wide'),design:u=>'<section class="card"><h2>Universum gestalten</h2>'+field('Universumsname',u.name)+field('Profilname',u.owner)+'<p class="sub">Hauptfarbe</p><div class="row wrap">'+colors.map(c=>'<button class="swatch" data-color="'+c+'" style="background:'+c+'" aria-label="Farbe '+c+'"></button>').join('')+'</div>'+btn('Namen speichern','designsave','primary wide')+'</section><section class="card"><h2>Mein Baukasten</h2><p class="sub">Ausgeschaltete Funktionen verschwinden aus den entsprechenden Bereichen. Daten bleiben erhalten.</p>'+mods.map(([id,label])=>'<label class="listrow"><span>'+label+'</span><input type="checkbox" data-module="'+id+'" '+(u.modules.includes(id)?'checked':'')+'></label>').join('')+'</section><section class="card"><h3>Datensicherung</h3>'+btn('Gesamtes Backup exportieren','export','wide')+'<p class="small">Beim Import wird deine lokale Sammlung ersetzt. Bitte vorher ein Backup exportieren.</p><input id="backup" type="file" accept=".json,application/json"></section>',players:u=>'<section class="card"><h2>Meine Spieler</h2><p class="sub">Spieler werden nur in diesem Universum geführt.</p>'+field('Neuer Spieler','')+btn('Spieler hinzufügen','playeradd','primary wide')+'</section><section class="card">'+(u.players.length?u.players.map(p=>'<div class="listrow"><span>'+esc(p.name)+'</span><button class="button" data-removeplayer="'+p.id+'">Entfernen</button></div>').join(''):'<p class="empty">Noch keine Spieler vorhanden.</p>')+'</section>',tournament:u=>{let t=u.tournaments.find(x=>x.id===u.current);const any=(m)=>u.modules.includes(m);if(!t)return '<section class="card"><h2>Neues Turnier</h2>'+field('Turniername','Pokerabend')+'<div class="grid">'+field('Startstack',5000,'number')+field('Gewünschte Minuten',150,'number')+'</div><p class="sub">Du kannst bestehende Spieler übernehmen. Die Turnierdaten bleiben lokal.</p>'+btn('Turnier erstellen','newt','primary wide')+'</section>';let total=t.entries.length*t.stack+(t.extraChips||0),alive=t.entries.filter(x=>!x.out).length;return '<section class="card"><h2>'+esc(t.name)+'</h2><span class="pill">'+(t.done?'Abgeschlossen':'In Bearbeitung')+'</span><div class="grid"><div class="stat"><b>'+alive+'</b>Noch dabei</div><div class="stat"><b>'+fmt(alive?total/alive:0)+'</b>Ø Stack</div></div><p class="small">'+fmt(total)+' Chips insgesamt · '+t.entries.length+' Starter</p></section>'+(any('timer')?'<section class="card"><h3>Blinds-Timer</h3><p class="sub">Aktuelles Level: '+(t.level+1)+' · '+fmt(t.levels[t.level]?.sb||0)+' / '+fmt(t.levels[t.level]?.bb||0)+'</p><div style="font-size:52px;font-variant-numeric:tabular-nums;text-align:center;color:var(--accent)" id="clock">'+Math.floor(t.remaining/60).toString().padStart(2,'0')+':'+(t.remaining%60).toString().padStart(2,'0')+'</div><div class="grid">'+btn(t.running?'Pause':'Start / Weiter','timerplay','primary')+btn('Zurücksetzen','timerreset')+btn('Vorheriges Level','prevlevel')+btn('Nächstes Level','nextlevel')+'</div><p class="small">Beim Wiederöffnen wird der gespeicherte Timer aus Sicherheitsgründen pausiert.</p></section>':'')+(any('eliminations')?'<section class="card"><h3>Ausscheidungen</h3>'+(t.entries.length?t.entries.map(e=>'<div class="listrow"><span>'+esc(e.name)+' '+(e.out?'· Platz '+e.rank:'· Aktiv')+'</span><button class="button" data-eliminate="'+e.id+'" '+(t.done?'disabled':'')+'>'+(e.out?'Rückgängig':'Ausgeschieden')+'</button></div>').join(''):'<p class="empty">Füge zuerst Spieler im Bereich Spieler hinzu und starte ein neues Turnier.</p>')+'</section>':'')+'<section class="card"><div class="grid">'+btn('Turnier speichern','save')+btn('Turnier abschliessen','finish',t.done?'':'primary')+btn('Zur Turnierübersicht','history')+btn('Neues Turnier','cleart')+'</div></section>'},history:u=>'<section class="card"><h2>Turnierarchiv</h2>'+btn('Altes Turnier nachtragen','manual')+'<p class="sub">Gespeicherte Turniere lassen sich jederzeit laden.</p>'+(u.tournaments.length?u.tournaments.slice().reverse().map(t=>'<div class="listrow"><span>'+esc(t.name)+'<br><small>'+esc(t.date)+' · '+(t.done?'Abgeschlossen':'Laufend')+'</small></span><button class="button" data-load="'+t.id+'">Öffnen</button></div>').join(''):'<p class="empty">Noch keine Turniere erfasst.</p>')+'</section>',stats:u=>{const finished=u.tournaments.filter(t=>t.done);const m=new Map(u.players.map(p=>[p.name,{name:p.name,played:0,wins:0,podiums:0,rank:0}]));finished.forEach(t=>t.entries.forEach(e=>{let x=m.get(e.name);if(!x){x={name:e.name,played:0,wins:0,podiums:0,rank:0};m.set(e.name,x)}if(e.rank){x.played++;x.rank+=e.rank;if(e.rank===1)x.wins++;if(e.rank<=3)x.podiums++}}));const a=[...m.values()].filter(x=>x.played).sort((x,y)=>y.wins-x.wins||x.rank/x.played-y.rank/y.played);return '<section class="card"><h2>Statistik-Welt</h2><p class="sub">Berechnet aus abgeschlossenen Turnieren deines Universums.</p><div class="grid"><div class="stat"><b>'+finished.length+'</b>Abgeschlossen</div><div class="stat"><b>'+a.length+'</b>Aktive Karrieren</div></div></section>'+(u.modules.includes('rankings')?'<section class="card"><h3>Ewige Rangliste</h3>'+(a.length?'<table><thead><tr><th>Spieler</th><th>Titel</th><th>Ø Rang</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.wins+'</td><td>'+(x.rank/x.played).toFixed(2)+'</td></tr>').join('')+'</tbody></table>':'<p class="empty">Schliesse ein Turnier ab, um Statistiken zu erhalten.</p>')+'</section>':'')+(u.modules.includes('hall')?'<section class="card"><h3>Hall of Fame</h3><p>'+(a[0]?'Meiste Titel: '+esc(a[0].name)+' ('+a[0].wins+')':'Noch keine Ergebnisse')+'</p></section>':'')+(u.modules.includes('duels')?'<section class="card"><h3>Duell</h3><p class="sub">Duell-Vergleich wird im nächsten Ausbauschritt ergänzt.</p></section>':'')}};function values(){return Object.fromEntries([...document.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]))}function issue(a){alert(a)}function act(action,el){const u=active(),v=values();if(action==='create'||action==='add'){if(action==='add'){let name=prompt('Name des neuen Universums');if(!name)return;db.universes.push({id:uuid(),name,owner:u.owner,accent:'#dfba7f',players:[],tournaments:[],current:null,modules:[...defaults]})}else{if(!v['Universumsname']?.trim()||!v['Profilname']?.trim())return issue('Bitte Namen eingeben.');db.universes.push({id:uuid(),name:v['Universumsname'].trim(),owner:v['Profilname'].trim(),accent:'#dfba7f',players:[],tournaments:[],current:null,modules:[...defaults]})}db.active=db.universes.at(-1).id;tab='home'}else if(action==='designsave'){u.name=v['Universumsname'].trim()||u.name;u.owner=v['Profilname'].trim()||u.owner}else if(action==='playeradd'){let name=v['Neuer Spieler']?.trim();if(!name)return issue('Bitte Spielername eingeben.');if(u.players.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return issue('Spieler existiert bereits.');u.players.push({id:uuid(),name})}else if(action==='newt'){if(!u.players.length)return issue('Bitte zuerst Spieler anlegen.');const stack=Math.max(1,Number(v.Startstack)||5000),duration=Math.max(10,Number(v['Gewünschte Minuten'])||150);const levels=[[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[600,1200],[800,1600],[1200,2400],[2000,4000]].map(([sb,bb])=>({sb,bb}));const t={id:uuid(),name:v.Turniername||'Pokerabend',date:new Date().toISOString().slice(0,10),stack,levels,level:0,remaining:Math.round(duration/12)*60,running:false,entries:u.players.map(p=>({id:p.id,name:p.name,out:false,rank:null,time:null})),extraChips:0,done:false};u.tournaments.push(t);u.current=t.id}else if(action==='save'){const t=u.tournaments.find(t=>t.id===u.current);if(t)t.running=false;issue('Turnier lokal gespeichert.')}else if(action==='finish'){const t=u.tournaments.find(t=>t.id===u.current);if(!t)return;const active=t.entries.filter(e=>!e.out);if(active.length!==1)return issue('Vor Abschluss muss genau ein Spieler übrig sein.');if(!confirm('Turnier abschliessen und Sieger bestätigen?'))return;active[0].rank=1;t.done=true;t.running=false}else if(action==='timerplay'){const t=u.tournaments.find(t=>t.id===u.current);t.running=!t.running;if(t.running)t.until=Date.now()+t.remaining*1000}else if(action==='timerreset'){let t=u.tournaments.find(t=>t.id===u.current);t.running=false;t.remaining=900}else if(action==='nextlevel'||action==='prevlevel'){let t=u.tournaments.find(t=>t.id===u.current);t.running=false;t.level=Math.max(0,Math.min(t.levels.length-1,t.level+(action==='nextlevel'?1:-1)));t.remaining=900}else if(action==='history'){tab='history'}else if(action==='cleart'){u.current=null}else if(action==='export'){let b=new Blob([JSON.stringify({format:'bp-private-universes-v1',data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poker-universen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(action==='manual'){issue('Manuelles Nachtragen ist für eine spätere Ausbaustufe vorgesehen.')}save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.switch){db.active=b.dataset.switch;tab='home';save();render();return}if(b.dataset.color){active().accent=b.dataset.color;save();render();return}if(b.dataset.removeplayer){let u=active(),p=u.players.find(x=>x.id===b.dataset.removeplayer);if(p&&confirm('Spieler '+p.name+' entfernen? Frühere Turniere bleiben erhalten.')){u.players=u.players.filter(x=>x.id!==p.id);save();render()}return}if(b.dataset.load){active().current=b.dataset.load;const t=active().tournaments.find(x=>x.id===b.dataset.load);if(t)t.running=false;tab='tournament';save();render();return}if(b.dataset.eliminate){let t=active().tournaments.find(x=>x.id===active().current),p=t.entries.find(x=>x.id===b.dataset.eliminate);if(!p)return;if(p.out){if(!confirm('Ausscheidung rückgängig machen?'))return;let impacted=t.entries.filter(x=>x.out&&x.time>p.time);impacted.forEach(x=>x.rank++);p.out=false;p.rank=null;p.time=null}else{if(t.entries.filter(x=>!x.out).length<=1)return;p.rank=t.entries.filter(x=>!x.out).length;p.out=true;p.time=Date.now()}save();render();return}if(b.dataset.action)act(b.dataset.action,b)});
document.addEventListener('change',async e=>{if(e.target.dataset.module){let u=active(),id=e.target.dataset.module;u.modules=e.target.checked?[...new Set([...u.modules,id])]:u.modules.filter(x=>x!==id);save();render()}if(e.target.id==='backup'){try{const o=JSON.parse(await e.target.files[0].text());if(o.format!=='bp-private-universes-v1'||!Array.isArray(o.data?.universes))throw Error('Ungültiges Backup');if(!confirm('Alle lokalen Universen durch dieses Backup ersetzen?'))return;db=o.data;tab='home';save();render()}catch(err){issue('Backup konnte nicht eingelesen werden: '+err.message)}}});
setInterval(()=>{const u=active(),t=u?.tournaments.find(x=>x.id===u.current);if(!t?.running)return;t.remaining=Math.max(0,Math.ceil((t.until-Date.now())/1000));if(!t.remaining){t.running=false;if(t.level<t.levels.length-1){t.level++;t.remaining=900}}const c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(t.remaining/60)).padStart(2,'0')+':'+String(t.remaining%60).padStart(2,'0');if(t.remaining%5===0)save()},500);render()})();
</script></body></html>
